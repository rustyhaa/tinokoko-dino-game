<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티노코코 동시점프 러너</title>
<style>
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: #EAF1E6;
    color: #5A4636;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #stage {
    max-width: 960px;
    margin: 20px auto;
    padding: 14px 16px 12px;
    box-sizing: border-box;
    background: #FFFBF2;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(90, 70, 54, 0.10);
  }
  #top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  #pills {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pill {
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.7);
    box-shadow: 0 1px 3px rgba(90, 70, 54, 0.08);
    font-size: 14px;
    white-space: nowrap;
  }
  .pill b {
    font-size: 16px;
    font-weight: 800;
  }
  .round {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid #E0CFA8;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #wrap {
    position: relative;
    width: 100%;
  }
  #game {
    display: block;
    border-radius: 16px;
    background: #FFF6E0;
    touch-action: none; /* 모바일에서 탭해도 페이지가 스크롤·확대되지 않게 */
    user-select: none;
    -webkit-user-select: none;
  }
  /* 시작·종료 패널 레이어: 빈 곳은 캔버스로 통과, 패널만 누를 수 있다 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .panel {
    width: min(400px, 100%);
    box-sizing: border-box;
    padding: 16px 20px 18px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 8px 22px rgba(90, 70, 54, 0.16);
    text-align: center;
    pointer-events: auto;
  }
  .panel h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .panel .sub {
    margin: 0 0 12px;
    font-size: 14px;
    opacity: 0.85;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .card {
    padding: 10px 8px;
    border: 2px solid #E8D6B0;
    border-radius: 16px;
    background: #FFFCF5;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .card img {
    display: block;
    height: 84px;
    margin: 0 auto 6px;
  }
  .card strong {
    display: block;
    font-size: 17px;
    font-weight: 800;
  }
  .card span {
    font-size: 13px;
    opacity: 0.8;
  }
  .card[aria-pressed="true"] {
    border-color: #6FB39A;
    background: #E6F4EC;
    box-shadow: 0 0 0 3px rgba(111, 179, 154, 0.22);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn {
    padding: 11px 24px;
    border: none;
    border-radius: 999px;
    background: #DDEBE0;
    color: #5A4636;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 4px 0 #B9CFC0, 0 6px 12px rgba(90, 70, 54, 0.12);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
  }
  .btn.primary {
    background: #F4B98E;
    box-shadow: 0 4px 0 #D99A6D, 0 6px 12px rgba(90, 70, 54, 0.14);
  }
  #start-btn {
    width: 100%;
  }
  .btn:hover:not(:disabled) {
    filter: brightness(1.03);
  }
  .btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #B9CFC0, 0 2px 6px rgba(90, 70, 54, 0.12);
  }
  .btn.primary:active:not(:disabled) {
    box-shadow: 0 1px 0 #D99A6D, 0 2px 6px rgba(90, 70, 54, 0.14);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .card:focus-visible,
  .btn:focus-visible,
  .round:focus-visible {
    outline: 3px solid #6FB39A;
    outline-offset: 2px;
  }
  #test-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }
  #test-badge[data-status="PASS"] { color: #2E7D4F; }
  #test-badge[data-status="FAIL"] { color: #B3261E; }
  #hint {
    margin: 10px 4px 0;
    font-size: 14px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <h1>티노코코 동시점프 러너</h1>
    <div id="pills">
      <span class="pill">⭐ <b id="score">0</b>개</span>
      <span class="pill">최고 ⭐ <b id="best">0</b>개</span>
      <button id="mute" class="round" type="button" aria-label="소리 끄기">🔊</button>
    </div>
  </header>
  <div id="wrap">
    <canvas id="game" role="img" aria-label="캐릭터 한 명이 달리며 장애물을 넘는 게임 화면"></canvas>
    <div id="overlay">
      <section id="ready-panel" class="panel" hidden>
        <h2>누구랑 달릴까요?</h2>
        <p class="sub">고른 친구 한 명만 달려요. 언제든 바꿀 수 있어요.</p>
        <div class="cards">
          <button class="card" type="button" data-char="tino" aria-pressed="false">
            <img src="assets/tino_run_flip.png" alt="">
            <strong>티노</strong>
            <span>아기 티라노</span>
          </button>
          <button class="card" type="button" data-char="coco" aria-pressed="false">
            <img src="assets/coco_run_flip.png" alt="">
            <strong>코코</strong>
            <span>아기 범고래</span>
          </button>
        </div>
        <button id="start-btn" class="btn primary" type="button" disabled>출발!</button>
      </section>
      <section id="over-panel" class="panel" hidden>
        <h2>풍덩! 다시 해볼까?</h2>
        <p class="sub">넘은 장애물 ⭐ <b id="final-score">0</b>개</p>
        <div class="actions">
          <button id="retry-btn" class="btn primary" type="button">다시 하기</button>
          <button id="change-btn" class="btn" type="button">캐릭터 바꾸기</button>
        </div>
      </section>
    </div>
    <div id="test-badge" hidden></div>
  </div>
  <p id="hint">스페이스바 · ↑ · 화면 탭 = 점프! 물웅덩이와 돌멩이를 넘어보세요.</p>
</div>

<script>
(function () {
  'use strict';

  // ===== 기본 설정 =====
  // 월드(논리) 높이 400. 실제 화면 높이는 360~420px 사이에서 비율에 맞춰 축소·확대된다.
  const WORLD_H = 400;
  const GROUND_Y = 320;        // 땅 기준선 (발끝이 닿는 y)
  const DISPLAY_H = 120;       // 캐릭터 표시 높이 (티노·코코 공통, 폭은 원본 비율대로)
  const PLAYER_X = 120;        // 선택한 캐릭터의 x 위치 (한 명만 달리므로 한 자리)

  // 속도: 별 개수에 따라 완만히 빨라지고 최고 속도에서 고정
  const START_SPEED = 240;     // 시작 속도 (월드 px/s)
  const MAX_SPEED = 480;       // 최고 속도
  const SPEED_PER_STAR = 5;    // 별 1개당 목표 속도 증가 (48개에서 최고 속도)
  const SPEED_EASE = 25;       // 목표 속도로 다가가는 가속 (px/s²). 계단처럼 튀지 않게

  // 점프 물리: 강한 중력 + 큰 초기속도 = 짧고 날카로운 포물선 (크롬 공룡식)
  // 체공 시간 T를 속도와 거의 무관하게 고정하고 JUMP_V = g·T/2 로 둔다.
  // 그래서 체공 중 수평 이동거리(속도 × T)가 속도에 비례해 커진다.
  const GRAVITY = 2400;        // 중력 (월드 px/s²)
  const AIR_T_START = 0.78;    // 시작 속도에서 체공 시간(초)
  const AIR_T_MAX = 0.79;      // 최고 속도에서 체공 시간(초). 높이 g·T²/8 ≈ 187px (화면 위로 안 나감)
  const JUMP_BUFFER = 0.18;    // 공중에서 누른 점프를 기억하는 시간(초). 착지하자마자 실행

  // 장애물 간격은 거리가 아니라 시간 기준: 앞 장애물이 지나간 뒤 최소 1.35초 + 랜덤 0~0.7초
  const GAP_MIN_SEC = 1.35;
  const GAP_RANDOM_SEC = 0.7;
  const FIRST_DELAY = 1.2;     // 재시작 후 첫 장애물이 나오기까지 최소 시간(초)

  // 장애물 크기 (표시 px). 물웅덩이 44~60, 돌멩이 32~44 범위 안
  const PUDDLE = { w: 52, h: 16 };
  const ROCK = { w: 38, h: 40 };
  const ROCK_RATIO = 0.35;     // 전체 장애물 중 돌멩이 비율 (나머지는 물웅덩이)

  // 충돌 판정: 표시 크기에서 안쪽을 줄인다. 발끝(아래쪽)은 줄이지 않는다. 땅 장애물과 닿아야 하기 때문.
  // 캐릭터: 좌우 31%씩 → 판정 폭 38%, 위쪽 35%
  const PLAYER_INSET = { x: 0.31, top: 0.35 };
  // 장애물: 좌우 25%씩 → 판정 폭 50%. 물웅덩이는 높이 판정을 절반(위쪽 50%), 돌멩이는 위쪽 25%
  const OBSTACLE_INSET = { x: 0.25, puddleTop: 0.5, rockTop: 0.25 };
  const DROP_COUNT = 10;       // 물웅덩이를 밟을 때 튀는 물방울 수
  const DROP_GRAVITY = 900;    // 물방울·먼지가 떨어지는 중력 (점프 중력과 별개, 천천히 보이게)
  const SPLASH_SECONDS = 0.35; // 물웅덩이를 밟은 뒤 웃음 포즈 유지 시간

  // 속도감 연출
  const STEP_SLOW = 0.16;      // 시작 속도에서 run/walk 포즈 교체 주기(초)
  const STEP_FAST = 0.09;      // 최고 속도에서 교체 주기(초)
  const STEP_LIFT = 2;         // walk 포즈일 때 살짝 떠 보이는 높이(px)
  const SPEED_LINE_FROM = 380; // 이 속도 이상에서 화면 가장자리에 스피드 라인

  const RESTART_LOCK_MS = 500; // 풍덩 직후 연타로 바로 재시작되는 것을 막는 짧은 대기
  const BEST_KEY = 'tinokoko-dino-best';
  const CHAR_KEY = 'tinokoko-dino-char';
  const CHAR_IDS = ['tino', 'coco'];

  // 자동 테스트 (?test=1): 장애물 왼쪽 끝이 판정 오른쪽 끝에서 속도×AUTOPILOT_LEAD 초 안쪽이면 점프
  const AUTOPILOT_LEAD = 0.2;
  const TEST_TIMEOUT = 60;     // 게임 시간(초) 안에 못 넘으면 FAIL

  const CLOUD_TILE = 820;      // 구름 반복 간격
  const CLOUD_SPEED = 0.1;     // 구름 흐름 속도 (게임 속도 배율)
  const GRASS_TILE = 600;      // 잔디 점 반복 간격

  const CHARACTERS = {
    tino: {
      name: '티노',
      sprites: {
        run: 'assets/tino_run_flip.png', walk: 'assets/tino_walk_flip.png',
        jump: 'assets/tino_jump_v2.png', laugh: 'assets/tino_laugh_v2.png',
      },
    },
    coco: {
      name: '코코',
      // walk 원본은 같은 높이로 맞추면 머리가 run보다 작게 보여서(머리 폭 233 vs 264px) 표시만 키운다
      walkScale: 1.12,
      sprites: {
        run: 'assets/coco_run_flip.png', walk: 'assets/coco_walk_flip.png',
        jump: 'assets/coco_jump_v2.png', laugh: 'assets/coco_laugh_v2.png',
      },
    },
  };

  // 배경 장식 (고정 배치, 반복해서 흐름)
  const CLOUDS = [
    { x: 120, y: 70, s: 1.0 },
    { x: 430, y: 48, s: 0.8 },
    { x: 640, y: 92, s: 1.1 },
  ];
  // 2겹 언덕: 뒤쪽 층이 더 느리게 흐른다 (패럴랙스, 게임 속도 배율 평균 0.25)
  const HILL_LAYERS = [
    { speed: 0.18, tile: 760, hills: [
      { x: 90, rx: 170, ry: 70, color: '#DCEAD9' },
      { x: 400, rx: 130, ry: 55, color: '#D6E7E8' },
      { x: 610, rx: 190, ry: 80, color: '#DCEAD9' },
    ] },
    { speed: 0.32, tile: 620, hills: [
      { x: 150, rx: 150, ry: 40, color: '#F1DCCB' },
      { x: 430, rx: 120, ry: 34, color: '#EBD3C0' },
    ] },
  ];
  // 땅의 대시·점 패턴 (게임 속도 그대로 흐름). v3보다 촘촘하고 길게
  const GROUND_LINES = [
    { y: 327, x: 0, tile: 46, len: 22, h: 2 },
    { y: 338, x: 14, tile: 70, len: 34, h: 1.5 },
    { y: 352, x: 40, tile: 58, len: 18, h: 1.5 },
    { y: 366, x: 5, tile: 90, len: 44, h: 1.5 },
    { y: 380, x: 30, tile: 52, len: 12, h: 1.5 },
    { y: 392, x: 60, tile: 76, len: 30, h: 1.5 },
  ];
  const GROUND_DOTS = [
    { y: 332, x: 8, tile: 38 },
    { y: 359, x: 25, tile: 44 },
    { y: 386, x: 3, tile: 34 },
  ];
  const GRASS = Array.from({ length: 36 }, () => ({
    x: Math.random() * GRASS_TILE,
    y: GROUND_Y + 14 + Math.random() * (WORLD_H - GROUND_Y - 26),
  }));

  // ===== 자동 테스트 모드 여부 (?test=1) =====
  const params = new URLSearchParams(window.location.search);
  const TEST_MODE = params.get('test') === '1';
  const FORCE_PUDDLE = TEST_MODE && params.get('force') === 'puddle'; // 물웅덩이만 나온다
  const NO_JUMP = TEST_MODE && params.get('nojump') === '1';          // 점프 입력을 모두 막는다
  const TEST_MAX_SPEED = TEST_MODE && params.get('speed') === 'max';  // 처음부터 최고 속도로 달린다
  const TEST_GOAL = FORCE_PUDDLE ? 3 : 5; // 충돌 없이 이 점수에 도달하면 PASS

  // ===== DOM =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalEl = document.getElementById('final-score');
  const muteBtn = document.getElementById('mute');
  const readyPanel = document.getElementById('ready-panel');
  const overPanel = document.getElementById('over-panel');
  const cards = document.querySelectorAll('.card');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const changeBtn = document.getElementById('change-btn');
  const badge = document.getElementById('test-badge');

  // ===== 상태 =====
  let dpr = 1;
  let scale = 1;               // CSS px / 월드 px
  let worldW = 900;            // 현재 화면 너비에 해당하는 월드 너비
  let state = 'ready';         // 'ready' 시작 화면 | 'playing' 진행 중 | 'crashed' 부딪힘
  let score = 0;
  let best = readBest();
  let speed = START_SPEED;
  let scroll = 0;              // 배경 흐름 거리
  let stepClock = 0;           // 다음 run/walk 포즈 교체까지 남은 시간
  let stepFrame = 0;           // 0 = run 포즈, 1 = walk 포즈
  let obstacles = [];          // { type, x, w, h, cleared }
  let nextGap = 0;             // 마지막 장애물 뒤로 필요한 간격(초)
  let spawnDelay = 0;          // 재시작 후 첫 장애물까지 남은 대기 시간
  let drops = [];              // 물방울 파티클 { x, y, vx, vy, life }
  let dust = [];               // 발밑 먼지 파티클 { x, y, vx, vy, r, life, max }
  let speedLines = [];         // 고속 구간 스피드 라인 { x, y, len, life }
  let splashLeft = 0;          // 웃음 포즈(물웅덩이를 밟은 뒤) 남은 시간
  let jumpBuffer = 0;          // 공중에서 누른 점프 입력이 남은 시간
  let lift = 0;                // 땅에서 떠 있는 높이
  let vy = 0;                  // 수직 속도
  let grounded = true;
  let crashedAt = 0;
  let jumpLog = null;          // 진행 중인 점프 실측 { speed, time, dist }
  let lastTs = null;
  let muted = false;
  let audioCtx = null;         // 첫 사용자 입력 뒤에만 만든다
  let selected = loadChoice(); // 'tino' | 'coco' | null (아직 안 고름)

  // 자동 테스트 결과
  let testDone = false;
  let testElapsed = 0;
  const testResult = { status: 'RUNNING', char: null, score: 0, reason: '' };
  const measuredJumps = [];    // 테스트 중 실제 점프 실측 기록
  const gapLog = [];           // 테스트 중 장애물 사이 시간 간격 실측(초)
  let lastClearAt = null;

  // 스프라이트 (캐릭터별 자세별 이미지)
  const sprites = { tino: {}, coco: {} };
  let spriteError = false;

  // ===== 이미지 로딩 =====
  function loadSprites() {
    for (const who of Object.keys(CHARACTERS)) {
      for (const pose of Object.keys(CHARACTERS[who].sprites)) {
        const img = new Image();
        img.onerror = () => { spriteError = true; };
        img.src = CHARACTERS[who].sprites[pose];
        sprites[who][pose] = img;
      }
    }
  }

  function spritesReady() {
    return Object.values(sprites).every(group =>
      Object.values(group).every(img => img.complete && img.naturalWidth > 0));
  }

  // 표시 너비: 높이는 DISPLAY_H로 통일하고 원본 비율대로 넓이를 정한다
  function spriteWidth(img) {
    if (!img || !img.complete || !img.naturalHeight) return DISPLAY_H * 0.8;
    return DISPLAY_H * img.naturalWidth / img.naturalHeight;
  }

  // 지금 달리는 캐릭터 (시작 화면에서는 고른 캐릭터를 미리 보여 준다)
  function activeChar() {
    return selected || 'tino';
  }

  // ===== 화면 크기 =====
  function resize() {
    const cssW = wrap.clientWidth;
    // 높이는 가로 비율을 따르되 360~420px 범위로 제한
    const cssH = Math.round(Math.min(420, Math.max(360, cssW * 0.42)));
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = cssH / WORLD_H;
    worldW = cssW / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }

  // ===== 저장 (실패해도 게임은 그대로 동작) =====
  function readBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch (err) {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  function loadChoice() {
    if (TEST_MODE) {
      const forced = params.get('char');
      return CHAR_IDS.includes(forced) ? forced : 'tino';
    }
    try {
      const saved = localStorage.getItem(CHAR_KEY);
      return CHAR_IDS.includes(saved) ? saved : null;
    } catch (err) {
      return null;
    }
  }

  function saveChoice(value) {
    if (TEST_MODE) return; // 테스트는 저장된 선택을 건드리지 않는다
    try {
      localStorage.setItem(CHAR_KEY, value);
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  // ===== 소리 (WebAudio 신스, 외부 파일 없음) =====
  function initAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) {
      audioCtx = null;
    }
  }

  // 주파수가 f0에서 f1로 미끄러지는 짧은 음 하나
  function tone(type, f0, f1, dur, vol) {
    if (muted || !audioCtx || audioCtx.state !== 'running') return;
    try {
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t0);
      osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (err) {
      // 소리 실패는 게임 진행에 영향 없게 무시
    }
  }

  const sfxJump = () => tone('triangle', 520, 980, 0.16, 0.25);   // 뽕
  const sfxStar = () => tone('sine', 1318, 1318, 0.35, 0.22);     // 띵
  const sfxSplash = () => tone('sine', 260, 90, 0.45, 0.35);      // 풍덩

  // ===== 물리 =====
  // 속도 → 체공 시간: 시작 속도 AIR_T_START에서 최고 속도 AIR_T_MAX까지 직선으로
  function airTimeFor(v) {
    const k = Math.min(1, Math.max(0, (v - START_SPEED) / (MAX_SPEED - START_SPEED)));
    return AIR_T_START + (AIR_T_MAX - AIR_T_START) * k;
  }

  // 점프 초기속도 = g·T/2 (T = 지금 속도에서의 체공 시간)
  function jumpVelocityFor(v) {
    return GRAVITY * airTimeFor(v) / 2;
  }

  // 별 개수로 정해지는 목표 속도
  function targetSpeedFor(stars) {
    if (TEST_MAX_SPEED) return MAX_SPEED;
    return Math.min(MAX_SPEED, START_SPEED + SPEED_PER_STAR * stars);
  }

  // 점프 중 위치와 착지 처리. 공중에서는 점프 입력을 무시하므로 이중 점프가 없다.
  function updateJump(dt) {
    if (grounded) return;
    vy -= GRAVITY * dt;
    lift += vy * dt;
    if (jumpLog) {
      jumpLog.time += dt;
      if (state === 'playing') jumpLog.dist += speed * dt;
    }
    if (lift <= 0) {
      lift = 0;
      vy = 0;
      grounded = true;
      landed();
      if (jumpBuffer > 0) {
        // 착지 직전에 누른 입력: 착지하자마자 바로 다시 점프
        jumpBuffer = 0;
        jump();
      }
    }
  }

  function jump() {
    if (!grounded || NO_JUMP) return;
    grounded = false;
    vy = jumpVelocityFor(speed);
    jumpLog = { speed: speed, time: 0, dist: 0 };
    sfxJump();
  }

  // 착지: 먼지 한 번 + 실측 기록
  function landed() {
    kickDust(6);
    if (jumpLog && TEST_MODE && state === 'playing') {
      measuredJumps.push({
        speed: Math.round(jumpLog.speed),
        airTime: +jumpLog.time.toFixed(3),
        dist: +jumpLog.dist.toFixed(1),
      });
    }
    jumpLog = null;
  }

  // 발밑 먼지: 착지·스텝 교체 때 뒤쪽(왼쪽)으로 흩어지는 작은 알갱이
  function kickDust(count) {
    const feetX = PLAYER_X + playerBox().w * 0.35;
    for (let i = 0; i < count; i++) {
      const life = 0.25 + Math.random() * 0.2;
      dust.push({
        x: feetX + (Math.random() - 0.5) * 16,
        y: GROUND_Y - 2,
        vx: -(30 + Math.random() * 60),
        vy: -(40 + Math.random() * 80),
        r: 1.8 + Math.random() * 2.2,
        life: life,
        max: life,
      });
    }
  }

  // ===== 충돌 박스 =====
  function playerBox() {
    const who = activeChar();
    return {
      x: PLAYER_X,
      y: GROUND_Y - lift - DISPLAY_H,
      w: spriteWidth(sprites[who].run),
      h: DISPLAY_H,
    };
  }

  function obstacleBox(o) {
    return { x: o.x, y: GROUND_Y - o.h, w: o.w, h: o.h };
  }

  // 판정 박스: 왼쪽·오른쪽·위쪽을 주어진 비율만큼 안쪽으로 줄인다 (발끝은 그대로)
  function hitBox(r, insetX, insetTop) {
    return {
      x: r.x + r.w * insetX,
      y: r.y + r.h * insetTop,
      w: r.w * (1 - 2 * insetX),
      h: r.h * (1 - insetTop),
    };
  }

  function playerHit() {
    return hitBox(playerBox(), PLAYER_INSET.x, PLAYER_INSET.top);
  }

  function obstacleHit(o) {
    const top = o.type === 'puddle' ? OBSTACLE_INSET.puddleTop : OBSTACLE_INSET.rockTop;
    return hitBox(obstacleBox(o), OBSTACLE_INSET.x, top);
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ===== 화면 패널 (시작 / 종료) =====
  function showPanel(name) {
    readyPanel.hidden = name !== 'ready';
    overPanel.hidden = name !== 'crashed';
  }

  function renderChoice() {
    for (const card of cards) {
      card.setAttribute('aria-pressed', String(card.dataset.char === selected));
    }
    startBtn.disabled = !selected;
  }

  // ===== 게임 흐름 =====
  function setScore() {
    scoreEl.textContent = String(score);
  }

  function setBest() {
    bestEl.textContent = String(best);
  }

  function startGame() {
    state = 'playing';
    score = 0;
    setScore();
    speed = targetSpeedFor(0);
    obstacles = [];
    drops = [];
    dust = [];
    speedLines = [];
    nextGap = 0;
    spawnDelay = FIRST_DELAY;
    splashLeft = 0;
    jumpBuffer = 0;
    showPanel(null);
  }

  // 시작 화면으로 돌아가 캐릭터를 다시 고를 수 있게 한다
  function goReady() {
    state = 'ready';
    score = 0;
    setScore();
    obstacles = [];
    nextGap = 0;
    jumpBuffer = 0;
    showPanel('ready');
    renderChoice();
  }

  // 캐릭터를 고른 뒤에만 출발한다 (첫 점프까지 함께)
  function beginRun() {
    if (!spritesReady() || !selected) return;
    initAudio();
    startGame();
    jump();
  }

  function crash() {
    state = 'crashed';
    crashedAt = performance.now();
    jumpBuffer = 0;
    if (score > best) {
      best = score;
      writeBest(best);
      setBest();
    }
    finalEl.textContent = String(score);
    showPanel('crashed');
    sfxSplash();
    if (TEST_MODE && !testDone) finishTest('FAIL', '충돌 (점수 ' + score + ')');
  }

  // 시간 기준 스폰: 앞 장애물 꼬리가 지나간 뒤 다음 장애물 머리가 오기까지 nextGap초 이상.
  // 속도는 별 개수로만 오르므로, 그 사이 속도는 "지금 화면의 미통과 장애물을 다 넘었을 때의 목표 속도"를 넘지 않는다.
  // 이 최대 속도로 거리를 잡으면 어떤 속도에서도 시간 간격이 보장된다.
  function maybeSpawn() {
    if (spawnDelay > 0) return;
    const last = obstacles[obstacles.length - 1];
    if (last) {
      const pending = obstacles.filter(o => !o.cleared).length;
      const worstSpeed = Math.max(speed, targetSpeedFor(score + pending));
      if (worldW + 10 - (last.x + last.w) < nextGap * worstSpeed) return;
    }
    if (!FORCE_PUDDLE && Math.random() < ROCK_RATIO) {
      obstacles.push({ type: 'rock', x: worldW + 10, w: ROCK.w, h: ROCK.h, cleared: false, splashed: false });
    } else {
      obstacles.push({ type: 'puddle', x: worldW + 10, w: PUDDLE.w, h: PUDDLE.h, cleared: false, splashed: false });
    }
    nextGap = GAP_MIN_SEC + Math.random() * GAP_RANDOM_SEC;
  }

  // 물웅덩이를 지상에서 밟았을 때: 첨벙 소리, 물방울, 잠깐 웃음 포즈 (게임은 계속)
  function splash(o) {
    o.splashed = true;
    splashLeft = SPLASH_SECONDS;
    const feetX = PLAYER_X + playerBox().w / 2;
    for (let i = 0; i < DROP_COUNT; i++) {
      drops.push({
        x: feetX + (Math.random() - 0.5) * 30,
        y: GROUND_Y - 4,
        vx: (Math.random() - 0.5) * 120,
        vy: -(150 + Math.random() * 150),
        life: 0.5 + Math.random() * 0.2,
      });
    }
    sfxSplash();
  }

  function updateDrops(dt) {
    for (const p of drops) {
      p.vy += DROP_GRAVITY * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    drops = drops.filter(p => p.life > 0 && p.y < GROUND_Y);
    for (const p of dust) {
      p.vy += DROP_GRAVITY * dt;
      p.x += p.vx * dt;
      p.y = Math.min(GROUND_Y - 1, p.y + p.vy * dt);
      p.life -= dt;
    }
    dust = dust.filter(p => p.life > 0);
    for (const s of speedLines) {
      s.x -= speed * 2.5 * dt;
      s.life -= dt;
    }
    speedLines = speedLines.filter(s => s.life > 0 && s.x + s.len > 0);
  }

  // 고속 구간: 화면 위·아래 가장자리에 옅은 스피드 라인을 잠깐씩
  function maybeSpeedLine(dt) {
    if (speed < SPEED_LINE_FROM) return;
    const rate = 4 + 10 * (speed - SPEED_LINE_FROM) / (MAX_SPEED - SPEED_LINE_FROM); // 초당 개수
    if (Math.random() > rate * dt) return;
    const top = Math.random() < 0.5;
    speedLines.push({
      x: worldW * (0.55 + Math.random() * 0.5),
      y: top ? 14 + Math.random() * 60 : GROUND_Y + 8 + Math.random() * (WORLD_H - GROUND_Y - 16),
      len: 60 + Math.random() * 90,
      life: 0.25 + Math.random() * 0.2,
    });
  }

  // 달리기 애니메이션: run/walk 포즈 교체. 빠를수록 교체 주기가 짧다
  function updateStep(dt) {
    if (!grounded) return;
    stepClock -= dt;
    if (stepClock > 0) return;
    const k = Math.min(1, Math.max(0, (speed - START_SPEED) / (MAX_SPEED - START_SPEED)));
    stepClock += STEP_SLOW + (STEP_FAST - STEP_SLOW) * k;
    if (stepClock < 0) stepClock = 0;
    stepFrame = 1 - stepFrame;
    if (state === 'playing') kickDust(2);
  }

  // 자동 테스트 조종사: 가장 가까운 장애물이 가까워지면 점프 (?test=1 전용, nojump 모드에서는 끔)
  function autoPilot() {
    if (!TEST_MODE || NO_JUMP || testDone || !grounded) return;
    const next = obstacles.find(o => !o.cleared);
    if (!next) return;
    const hit = playerHit();
    const ob = obstacleHit(next);
    const dist = ob.x - (hit.x + hit.w);
    if (dist <= speed * AUTOPILOT_LEAD) jump();
  }

  function updatePlaying(dt) {
    speed = Math.min(targetSpeedFor(score), speed + SPEED_EASE * dt);
    const d = speed * dt;
    scroll += d;
    spawnDelay = Math.max(0, spawnDelay - dt);
    maybeSpawn();
    maybeSpeedLine(dt);
    for (const o of obstacles) o.x -= d;
    for (const p of drops) p.x -= d;
    for (const p of dust) p.x -= d;

    const hit = playerHit();
    for (const o of obstacles) {
      // 시간 간격 실측: 앞 장애물 꼬리가 기준선을 지난 시각 → 다음 장애물 머리가 같은 기준선에 닿은 시각
      if (TEST_MODE && !o.arrived && o.x < hit.x) {
        o.arrived = true;
        if (lastClearAt !== null) gapLog.push(+(testElapsed - lastClearAt).toFixed(3));
      }
      if (overlap(hit, obstacleHit(o))) {
        if (o.type === 'rock') {
          crash();
          return;
        }
        // 물웅덩이는 지상에서 밟을 때만 첨벙. 점프로 넘으면 아무 일도 없다.
        if (grounded && !o.splashed) splash(o);
      }
      // 판정 박스의 왼쪽 끝을 완전히 지나간 장애물 = 넘은 것
      if (!o.cleared && o.x + o.w < hit.x) {
        o.cleared = true;
        lastClearAt = testElapsed;
        score += 1;
        setScore();
        sfxStar();
        if (TEST_MODE && !testDone && score >= TEST_GOAL) finishTest('PASS', '충돌 없이 ' + score + '개 넘음');
      }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -20);
  }

  function update(dt) {
    updateJump(dt);
    updateDrops(dt);
    if (splashLeft > 0) splashLeft = Math.max(0, splashLeft - dt);
    if (jumpBuffer > 0) jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (state === 'playing') {
      autoPilot();
      updatePlaying(dt);
      updateStep(dt);
      if (TEST_MODE && !testDone) {
        testElapsed += dt;
        if (testElapsed > TEST_TIMEOUT) finishTest('FAIL', '시간 초과');
      }
    } else if (state === 'ready') {
      updateStep(dt);
    }
    // crashed: 세계는 멈추고, 캐릭터는 착지까지만 updateJump로 떨어진다
  }

  // 같은 물리 코드(updateJump와 같은 식)를 고정 dt로 돌려 한 번의 점프를 잰다
  function simulateJump(v, dt) {
    let y = 0;
    let vv = jumpVelocityFor(v);
    let t = 0;
    let peak = 0;
    do {
      vv -= GRAVITY * dt;
      y += vv * dt;
      t += dt;
      peak = Math.max(peak, y);
    } while (y > 0);
    return { airTime: +t.toFixed(3), dist: +(v * t).toFixed(1), peak: +peak.toFixed(1) };
  }

  // 점프 수평거리 ÷ 필요 클리어 거리(캐릭터 판정 폭 + 장애물 최대 판정 폭)
  function physicsReport() {
    const charHitW = playerHit().w;
    const obstHitW = Math.max(PUDDLE.w, ROCK.w) * (1 - 2 * OBSTACLE_INSET.x);
    const need = charHitW + obstHitW;
    const at = v => {
      const s = simulateJump(v, 1 / 60);
      return Object.assign({ speed: v, ratio: +(s.dist / need).toFixed(2) }, s);
    };
    const report = {
      startSpeed: START_SPEED,
      maxSpeed: MAX_SPEED,
      gravity: GRAVITY,
      clearNeed: +need.toFixed(1),
      charHitW: +charHitW.toFixed(1),
      obstacleHitWMax: +obstHitW.toFixed(1),
      sim: { start: at(START_SPEED), max: at(MAX_SPEED) },
    };
    if (measuredJumps.length) {
      const ratios = measuredJumps.map(j => j.dist / need);
      report.measured = {
        jumps: measuredJumps.slice(),
        airTimeMin: Math.min(...measuredJumps.map(j => j.airTime)),
        airTimeMax: Math.max(...measuredJumps.map(j => j.airTime)),
        ratioMin: +Math.min(...ratios).toFixed(2),
      };
    }
    if (gapLog.length) report.gapSecMin = Math.min(...gapLog);
    return report;
  }

  // 자동 테스트 결과를 화면 구석, console, document.title, window.__TEST_RESULT 에 남긴다
  function finishTest(status, reason) {
    testDone = true;
    testResult.status = status;
    testResult.char = activeChar();
    testResult.score = score;
    testResult.reason = reason;
    testResult.speedMode = TEST_MAX_SPEED ? 'max' : 'start';
    testResult.speedNow = Math.round(speed);
    testResult.physics = physicsReport();
    window.__TEST_RESULT = Object.assign({}, testResult);
    const line = '[TEST ' + status + '] ' + CHARACTERS[activeChar()].name + ' 점수 ' + score + '/' + TEST_GOAL + ' · ' + reason;
    document.title = line;
    badge.textContent = line;
    badge.dataset.status = status;
    console.log(line, window.__TEST_RESULT);
  }

  // ===== 입력 =====
  function onAction() {
    if (!spritesReady()) return;
    initAudio();
    if (state === 'ready') {
      beginRun();
    } else if (state === 'playing') {
      if (grounded) jump();
      else jumpBuffer = JUMP_BUFFER; // 공중 입력은 잠깐 기억해 두었다가 착지 순간 점프
    } else if (state === 'crashed' && performance.now() - crashedAt > RESTART_LOCK_MS) {
      beginRun();
    }
  }

  function isJumpKey(e) {
    return e.code === 'Space' || e.code === 'ArrowUp';
  }

  window.addEventListener('keydown', e => {
    if (!isJumpKey(e)) return;
    e.preventDefault(); // 페이지 스크롤 방지
    // 포커스된 버튼(카드·다시 하기 등)이 스페이스바로 한 번 더 눌리지 않게 포커스를 뺀다
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
      document.activeElement.blur();
    }
    if (!e.repeat) onAction(); // 누르고 있어도 한 번만
  });

  window.addEventListener('keyup', e => {
    if (isJumpKey(e)) e.preventDefault();
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    onAction();
  });

  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  for (const card of cards) {
    card.addEventListener('click', () => {
      selected = card.dataset.char;
      saveChoice(selected);
      renderChoice();
    });
  }

  startBtn.addEventListener('click', beginRun);
  retryBtn.addEventListener('click', beginRun);
  changeBtn.addEventListener('click', goReady);

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
    muteBtn.blur(); // 포커스가 남아 스페이스바가 버튼을 누르지 않도록
  });

  // ===== 그리기 =====
  function wrapX(base, offset, tile) {
    return ((base - offset) % tile + tile) % tile;
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 34 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y + 4 * s, 22 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 26 * s, y + 4 * s, 24 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    // 크림색 세로 그라데이션 하늘
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#FBF7EC');
    sky.addColorStop(1, '#F7EBD5');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, worldW, GROUND_Y);

    // 구름 (느리게 흐름)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    for (const c of CLOUDS) {
      for (let x = wrapX(c.x, scroll * CLOUD_SPEED, CLOUD_TILE) - CLOUD_TILE; x < worldW + 200; x += CLOUD_TILE) {
        drawCloud(x, c.y, c.s);
      }
    }

    // 2겹 언덕 (뒤쪽 층이 더 느리게)
    for (const layer of HILL_LAYERS) {
      for (const h of layer.hills) {
        ctx.fillStyle = h.color;
        for (let x = wrapX(h.x, scroll * layer.speed, layer.tile) - layer.tile; x < worldW + 200; x += layer.tile) {
          ctx.beginPath();
          ctx.ellipse(x, GROUND_Y, h.rx, h.ry, 0, Math.PI, 0);
          ctx.fill();
        }
      }
    }

    // 땅
    ctx.fillStyle = '#EEDFBE';
    ctx.fillRect(0, GROUND_Y, worldW, WORLD_H - GROUND_Y);
    ctx.strokeStyle = '#CDB68C';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(worldW, GROUND_Y);
    ctx.stroke();

    // 땅 대시·점 패턴 (게임 속도 그대로 흐름)
    ctx.fillStyle = 'rgba(150, 120, 80, 0.28)';
    for (const row of GROUND_LINES) {
      for (let x = wrapX(row.x, scroll, row.tile) - row.tile; x < worldW; x += row.tile) {
        ctx.fillRect(x, row.y, row.len, row.h);
      }
    }
    ctx.fillStyle = 'rgba(150, 120, 80, 0.32)';
    for (const row of GROUND_DOTS) {
      for (let x = wrapX(row.x, scroll, row.tile) - row.tile; x < worldW; x += row.tile) {
        ctx.fillRect(x, row.y, 3, 3);
      }
    }

    // 잔디 점 (땅과 같은 속도로 흐름)
    ctx.fillStyle = '#B8D3A4';
    for (const g of GRASS) {
      for (let x = wrapX(g.x, scroll, GRASS_TILE) - GRASS_TILE; x < worldW + 20; x += GRASS_TILE) {
        ctx.beginPath();
        ctx.ellipse(x, g.y, 4, 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 물웅덩이: 파란 타원
  function drawPuddle(o) {
    const cx = o.x + o.w / 2;
    const cy = GROUND_Y - o.h / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#A8DCEB';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#6AAFC9';
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx - o.w * 0.15, cy - o.h * 0.12, o.w * 0.16, o.h * 0.14, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();
  }

  // 돌멩이: 회색 울퉁불퉁한 도형
  function drawRock(o) {
    const x = o.x;
    const y = GROUND_Y - o.h;
    const w = o.w;
    const h = o.h;
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + w * 0.05, y + h * 0.55);
    ctx.quadraticCurveTo(x + w * 0.2, y, x + w * 0.55, y + h * 0.02);
    ctx.quadraticCurveTo(x + w * 0.95, y + h * 0.1, x + w, y + h * 0.6);
    ctx.lineTo(x + w * 0.9, GROUND_Y);
    ctx.closePath();
    ctx.fillStyle = '#BDC3C9';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#838B93';
    ctx.stroke();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      if (o.type === 'puddle') drawPuddle(o);
      else drawRock(o);
    }
  }

  // 포즈마다 폭이 달라도 run 포즈(판정 기준) 가운데에 맞춰 그린다
  function drawSprite(img, x, liftPx, baseW, size) {
    if (!img || !img.complete || !img.naturalHeight) return;
    const k = size || 1;
    const w = spriteWidth(img) * k;
    const h = DISPLAY_H * k;
    ctx.drawImage(img, x + (baseW - w) / 2, GROUND_Y - liftPx - h, w, h);
  }

  function drawDust() {
    for (const p of dust) {
      ctx.fillStyle = 'rgba(190, 160, 115, ' + (0.6 * p.life / p.max).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSpeedLines() {
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (const s of speedLines) {
      ctx.strokeStyle = 'rgba(160, 135, 105, ' + Math.min(0.28, s.life).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.len, s.y);
      ctx.stroke();
    }
  }

  function drawDrops() {
    ctx.fillStyle = '#A8DCEB';
    ctx.strokeStyle = '#6AAFC9';
    ctx.lineWidth = 1.5;
    for (const p of drops) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  // 자세: 부딪힘 = 웃음, 땅에서 물웅덩이를 밟은 직후 = 웃음, 공중 = 점프,
  // 땅 = run/walk 포즈를 번갈아 (다리가 움직이는 것처럼). 한 명만 그린다.
  function drawTeam() {
    const who = activeChar();
    let pose = stepFrame === 1 ? 'walk' : 'run';
    if (state === 'crashed' || (grounded && splashLeft > 0)) pose = 'laugh';
    else if (!grounded) pose = 'jump';
    const step = pose === 'walk' ? STEP_LIFT : 0;
    const size = pose === 'walk' ? (CHARACTERS[who].walkScale || 1) : 1;
    drawSprite(sprites[who][pose], PLAYER_X, lift + step, spriteWidth(sprites[who].run), size);
  }

  function drawStatus() {
    ctx.fillStyle = '#5A4636';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '400 18px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(
      spriteError ? '이미지를 불러오지 못했어요 (assets 폴더를 확인해 주세요)' : '불러오는 중…',
      worldW / 2,
      WORLD_H / 2
    );
  }

  function draw() {
    ctx.clearRect(0, 0, worldW, WORLD_H);
    drawBackground();
    if (!spritesReady()) {
      drawStatus();
      return;
    }
    drawSpeedLines();
    drawObstacles();
    drawDust();
    drawDrops();
    drawTeam();
  }

  // ===== 메인 루프 (delta time 기반) =====
  function frame(ts) {
    const dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (spritesReady()) {
      if (TEST_MODE && state === 'ready') startGame(); // 테스트는 시작 화면 없이 바로 달린다
      update(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ===== 시작 =====
  loadSprites();
  resize();
  window.addEventListener('resize', resize);
  setScore();
  setBest();
  renderChoice();
  if (TEST_MODE) {
    testResult.char = activeChar();
    window.__TEST_RESULT = Object.assign({}, testResult);
    badge.hidden = false;
    badge.textContent = '자동 테스트 진행 중 · ' + CHARACTERS[activeChar()].name;
    showPanel(null);
  } else {
    showPanel('ready');
  }
  requestAnimationFrame(frame);
})();
</script>

<script>window.TK_FRAME = { demo: false, sleep: false };</script>
<script src="shared/frame.js"></script>
</body>
