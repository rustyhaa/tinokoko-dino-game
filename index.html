<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티노코코 달리기</title>
<style>
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    background: #F2F2F2;
    color: #535353;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #stage {
    max-width: 960px;             /* 보통 (기본). 크게·전체는 아래 size-* 클래스가 덮어쓴다 */
    margin: 20px auto;
    padding: 14px 16px 12px;
    box-sizing: border-box;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
  }
  #stage.size-large { max-width: 1440px; }
  #stage.size-full { max-width: none; }
  #top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .round {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid #CFCFCF;
    border-radius: 50%;
    background: #FFFFFF;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #wrap {
    position: relative;
    width: 100%;
  }
  #game {
    display: block;
    border-radius: 8px;
    background: #FFFFFF;
    touch-action: none; /* 모바일에서 탭해도 페이지가 스크롤·확대되지 않게 */
    user-select: none;
    -webkit-user-select: none;
  }
  /* 시작·종료 패널 레이어: 빈 곳은 캔버스로 통과, 패널만 누를 수 있다 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .panel {
    width: min(420px, 100%);
    box-sizing: border-box;
    padding: 16px 20px 18px;
    border-radius: 12px;
    background: #FFFFFF;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    text-align: center;
    pointer-events: auto;
  }
  .panel h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .panel .sub {
    margin: 0 0 12px;
    font-size: 14px;
    opacity: 0.85;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card {
    padding: 10px 8px;
    border: 2px solid #D8D8D8;
    border-radius: 12px;
    background: #FFFFFF;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .card canvas.preview {
    display: block;
    width: 110px;
    height: 84px;
    margin: 0 auto 6px;
  }
  .card strong {
    display: block;
    font-size: 17px;
    font-weight: 800;
  }
  .card span {
    font-size: 13px;
    opacity: 0.8;
  }
  .card[aria-pressed="true"] {
    border-color: #535353;   /* 배경은 흰색 유지: 미리보기 캔버스의 흰 바탕과 맞춘다 */
  }
  /* 배속 토글 */
  .opts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    margin-bottom: 14px;
  }
  .seg-group {
    display: inline-flex;
    gap: 4px;
  }
  .seg {
    padding: 5px 10px;
    border: 2px solid #D8D8D8;
    border-radius: 999px;
    background: #FFFFFF;
    color: inherit;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .seg[aria-pressed="true"] {
    border-color: #535353;
    background: #535353;
    color: #FFFFFF;
  }
  /* 상단 배속 버튼: 캔버스 밖에 두어 점프 입력(캔버스 탭)과 섞이지 않는다 */
  #top-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
  }
  .seg.small {
    padding: 3px 9px;
    font-size: 13px;
  }
  /* 상단 화면 크기 버튼 앞의 작은 라벨 */
  .opt-label {
    font-size: 13px;
    font-weight: 700;
    opacity: 0.8;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn {
    padding: 11px 24px;
    border: none;
    border-radius: 999px;
    background: #E6E6E6;
    color: #535353;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary {
    background: #535353;
    color: #FFFFFF;
  }
  #start-btn {
    width: 100%;
  }
  .btn:hover:not(:disabled) {
    filter: brightness(1.05);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .card:focus-visible,
  .seg:focus-visible,
  .btn:focus-visible,
  .round:focus-visible {
    outline: 3px solid #535353;
    outline-offset: 2px;
  }
  #test-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
  }
  #test-badge[data-status="PASS"] { color: #2E7D4F; }
  #test-badge[data-status="FAIL"] { color: #B3261E; }
  #hint {
    margin: 10px 4px 0;
    font-size: 14px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <h1>티노코코 달리기</h1>
    <div id="top-right">
      <div class="seg-group" role="group" aria-label="배속">
        <button class="seg small" type="button" data-speed="0.7" aria-pressed="false">0.7배</button>
        <button class="seg small" type="button" data-speed="1" aria-pressed="true">1배</button>
        <button class="seg small" type="button" data-speed="1.4" aria-pressed="false">1.4배</button>
      </div>
      <div class="seg-group" role="group" aria-label="화면 크기">
        <span class="opt-label">크기</span>
        <button class="seg small" type="button" data-size="normal" aria-pressed="true">보통</button>
        <button class="seg small" type="button" data-size="large" aria-pressed="false">크게</button>
        <button class="seg small" type="button" data-size="full" aria-pressed="false">전체</button>
      </div>
      <button id="mute" class="round" type="button" aria-label="소리 끄기">🔊</button>
    </div>
  </header>
  <div id="wrap">
    <canvas id="game" role="img" aria-label="캐릭터 한 명이 달리며 돌멩이를 넘는 게임 화면"></canvas>
    <div id="overlay">
      <section id="ready-panel" class="panel" hidden>
        <h2>누구랑 달릴까요?</h2>
        <p class="sub">고른 친구 한 명만 달려요.</p>
        <div class="cards">
          <button class="card" type="button" data-char="tino" aria-pressed="false">
            <canvas class="preview" width="220" height="168" data-preview="tino"></canvas>
            <strong>티노</strong>
            <span>아기 티라노</span>
          </button>
          <button class="card" type="button" data-char="coco" aria-pressed="false">
            <canvas class="preview" width="220" height="168" data-preview="coco"></canvas>
            <strong>코코</strong>
            <span>아기 범고래</span>
          </button>
        </div>
        <div class="opts">
          <div class="seg-group" role="group" aria-label="배속">
            <button class="seg" type="button" data-speed="0.7" aria-pressed="false">0.7배</button>
            <button class="seg" type="button" data-speed="1" aria-pressed="true">1배</button>
            <button class="seg" type="button" data-speed="1.4" aria-pressed="false">1.4배</button>
          </div>
        </div>
        <button id="start-btn" class="btn primary" type="button" disabled>출발!</button>
      </section>
      <section id="over-panel" class="panel" hidden>
        <h2>게임 오버</h2>
        <p class="sub">최종 점수 <b id="final-score">00000</b></p>
        <div class="actions">
          <button id="retry-btn" class="btn primary" type="button">다시 하기</button>
          <button id="change-btn" class="btn" type="button">캐릭터 바꾸기</button>
        </div>
      </section>
    </div>
    <div id="test-badge" hidden></div>
  </div>
  <p id="hint">스페이스바 · ↑ · 화면 탭 = 점프 · 배속은 위의 버튼 또는 1 · 2 · 3 키</p>
</div>

<script>
(function () {
  'use strict';

  // ===== 기본 설정 =====
  // 월드(논리) 높이 400. 실제 화면 높이는 360~420px 사이에서 비율에 맞춰 축소·확대된다.
  const WORLD_H = 400;
  const GROUND_Y = 320;        // 땅 기준선 (발끝이 닿는 y)
  const DISPLAY_H = 72;        // 캐릭터 표시 높이 (월드 px). 화면에서 대략 68~76px
  const PREVIEW_W = 110;       // 실사 그림의 기준 비율 (110 x 84, 발끝 y=84). 선택 카드 미리보기에 쓴다
  const PREVIEW_H = 84;
  const CHAR_W = DISPLAY_H * PREVIEW_W / PREVIEW_H; // 판정 박스 폭 ≈ 94
  const PLAYER_X = 120;        // 캐릭터 x 위치 (한 명만 달리므로 한 자리)

  // 속도 (1배 기준): 거리 점수에 비례해 서서히 오르고 최고 속도에서 고정 (v4 상한 480 유지)
  // 실제 값은 startSpeed() · maxSpeed() · speedEase()로 배속을 곱해 쓴다
  const START_SPEED = 240;     // 시작 속도 (월드 px/s)
  const MAX_SPEED = 480;       // 최고 속도
  const SPEED_FULL_SCORE = 2000; // 이 점수에서 최고 속도 도달 (약 2만 월드 px)
  const SPEED_EASE = 25;       // 목표 속도로 다가가는 가속 (px/s²). 계단처럼 튀지 않게
  const STEP_SLOW = 0.16;      // 시작 속도에서 다리 프레임 교체 주기(초)
  const STEP_FAST = 0.09;      // 최고 속도에서 교체 주기(초)

  // 점수: 장애물이 아니라 달린 거리로 센다. SCORE_PX 월드 px당 1점
  const SCORE_PX = 10;
  const SCORE_MAX = 99999;     // 5자리 표시 상한
  const BLINK_SEC = 0.6;       // 100점마다 숫자가 깜빡이는 시간

  // 점프 물리 (v4 그대로): 체공 시간 T를 속도와 거의 무관하게 고정, JUMP_V = g·T/2
  // 그래서 체공 중 수평 이동거리(속도 × T)가 속도에 비례해 커진다.
  const GRAVITY = 2400;        // 중력 (월드 px/s²)
  const AIR_T_START = 0.78;    // 시작 속도에서 체공 시간(초)
  const AIR_T_MAX = 0.79;      // 최고 속도에서 체공 시간(초)
  const JUMP_BUFFER = 0.18;    // 공중에서 누른 점프를 기억하는 시간(초). 착지하자마자 실행

  // 장애물 간격은 시간 기준: 앞 장애물이 지나간 뒤 최소 1.35초 + 랜덤 0~0.7초
  const GAP_MIN_SEC = 1.35;
  const GAP_RANDOM_SEC = 0.7;
  const FIRST_DELAY = 1.2;     // 재시작 후 첫 장애물까지 최소 시간(초)

  // 돌멩이: 한 덩이 크기 범위(월드 px). 1개(50%) · 2개 붙음(35%) · 3개 붙음(15%)
  const ROCK_W = [26, 38];
  const ROCK_H = [28, 42];
  const CLUSTER_OVERLAP = 4;   // 붙은 돌끼리 겹치는 폭

  // 충돌 판정: 시각보다 안쪽으로 좁힌다. 발끝(아래쪽)은 줄이지 않는다. 땅 장애물과 닿아야 하기 때문.
  // 캐릭터: 좌우 31%씩 → 판정 폭 38%, 위쪽 35%. 돌멩이: 좌우 25%씩 → 폭 50%, 위쪽 25%
  // 실사 그림은 이 박스와 같은 높이·가운데 기준으로 맞춘다
  const PLAYER_INSET = { x: 0.31, top: 0.35 };
  const ROCK_INSET = { x: 0.25, top: 0.25 };

  // 돌멩이 실루엣 3종 (각진 폴리곤). 점은 [가로 비율, 땅에서의 높이 비율]
  const ROCK_SHAPES = [
    [[0, 0], [0.12, 0.55], [0.38, 1], [0.7, 0.88], [1, 0.4], [1, 0]],
    [[0, 0], [0.2, 0.7], [0.5, 1], [0.8, 0.6], [1, 0]],
    [[0, 0], [0.08, 0.42], [0.3, 0.9], [0.62, 1], [0.9, 0.45], [1, 0]],
  ];

  // 땅 아래 대시 패턴 (게임 속도와 같이 흐른다)
  const DASH_TILE = 600;
  const DASHES = Array.from({ length: 16 }, () => ({
    x: Math.random() * DASH_TILE,
    y: GROUND_Y + 8 + Math.random() * (WORLD_H - GROUND_Y - 16),
    len: 4 + Math.random() * 12,
  }));

  // 중간 장치 (별 · 하트 방패). 보너스·보호만 있고 새 사망 조건은 없다
  // 장치는 한 번에 하나만 나오고, 8~15초 간격. 장애물과는 ITEM_SAFE 이상 떨어진 자리에서만 나온다.
  const ITEM_GAP_SEC = [8, 15];
  const ITEM_SAFE = 40;        // 장애물과 장치 사이 최소 여유 (월드 px)
  const STAR_SIZE = 26;
  const STAR_Y = GROUND_Y - 110; // 별 중심 높이: 달리기 자세의 몸에는 닿지 않고, 점프 중에만 닿는다
  const HEART_SIZE = 30;       // 하트는 지면 위에 놓인다 (달리다가 닿으면 방패)
  const STAR_POINTS = 50;      // 별 1개 = +50점 (거리 점수에 더한다)
  const INVULN_SEC = 1.0;      // 방패가 깨진 뒤 짧은 무적 시간(초). 이 동안 돌멩이는 깨지며 지나간다
  const STAR_COLOR = '#F5B82E';
  const STAR_EDGE = '#B9800F';
  const HEART_COLOR = '#E5484D';
  const SPEED_KEYS = { Digit1: '0.7', Digit2: '1', Digit3: '1.4', Numpad1: '0.7', Numpad2: '1', Numpad3: '1.4' };

  const RESTART_LOCK_MS = 500; // 풍덩 직후 연타로 바로 재시작되는 것을 막는 짧은 대기
  const BEST_KEY = 'tinokoko-dino-best';
  const CHAR_KEY = 'tinokoko-dino-char';
  const CHAR_IDS = ['tino', 'coco'];
  const CHAR_NAMES = { tino: '티노', coco: '코코' };
  const SPEED_KEY = 'tinokoko-dino-speed';
  const SPEED_IDS = ['0.7', '1', '1.4'];    // 배속 (문자열로 저장·비교)
  const SIZE_KEY = 'tinokoko-dino-size';
  const SIZE_IDS = ['normal', 'large', 'full']; // 화면 크기 (보통 · 크게 · 전체)
  // 캔버스 높이 범위 [하한, 상한] (px). 보통·크게는 가로 × 0.42, 전체는 창 높이 − SIZE_FULL_OFFSET
  const SIZE_H = { normal: [360, 420], large: [420, 680], full: [420, 900] };
  const SIZE_FULL_OFFSET = 170;

  // 자동 테스트 (?test=1): 장애물 왼쪽 끝이 판정 오른쪽 끝에서 속도×AUTOPILOT_LEAD 초 안쪽이면 점프
  const AUTOPILOT_LEAD = 0.2;
  const TEST_TIMEOUT = 60;     // 게임 시간(초) 안에 못 넘으면 FAIL
  const TEST_GOAL = 5;         // 장애물 5개를 충돌 없이 넘으면 PASS

  // 4차 연출·보상 (축하 · 낮/밤 · 꽃길 · 과일). 새 사망 조건 없음
  const MILESTONE = 500;        // 이 점수 배수를 넘을 때마다 축하 (구간당 1회)
  const CELEB_MAX = 40;         // 축하 파티클 동시 최대 개수
  const CELEB_SEC = 1.0;        // 축하 파티클 수명(초)
  const CELEB_COLORS = ['#F5B82E', '#E5484D', '#4C9BE8', '#4CAF6A', '#B48EDC'];
  const CHEER_SEC = 1.0;        // 축하 응원 캐릭터가 나와 있는 시간(초)
  const CHEER_START_SIZE = 0.6; // 출발 응원 크기 (표시 높이 비율)
  const CHEER_CELEB_SIZE = 0.6; // 축하 응원 크기 (표시 높이 비율, 플레이어의 약 60%)
  const NIGHT_SEC = 700;        // 700점마다 낮 ↔ 밤
  const NIGHT_FADE_SEC = 0.6;   // 낮/밤 색 전환 시간(초)
  const FLOWER_GAP = [90, 140]; // 꽃 사이 간격 (월드 px)
  const FLOWER_MAX = 60;
  const FLOWER_COLORS = ['#F4A6C0', '#8CC6F0', '#C9A7F0', '#F7B267'];
  const FLOWER_CENTER = '#F7D154';
  const FRUIT_SIZE = 26;
  const FRUIT_POINTS = 30;      // 과일 1개 = +30점
  const FRUIT_TYPES = ['apple', 'grape', 'orange'];
  const FRUIT_COLORS = { apple: '#E5484D', grape: '#8E5CC7', orange: '#F5A03A' };
  // 장치 등장 가중치 (별 : 과일 : 하트). 하트가 눈에 띄게 줄지 않도록 5:3:2 대신 2:1:2로 잡았다 (보고서 참고)
  const ITEM_WEIGHTS = { star: 2, fruit: 1, heart: 2 };

  // 캐릭터·돌멩이·배경은 INK 한 색, 바탕은 PAPER. 장치(별·하트)만 컬러로 그린다.
  const INK = '#535353';
  const PAPER = '#FFFFFF';
  // 밤 색: 순수 검정 금지. 지면·돌멩이·HUD 글자는 밝은 회색으로 바꾼다
  const NIGHT_PAPER = '#2E3748';
  const NIGHT_INK = '#D5DBE5';
  let curPaper = PAPER;        // 이번 프레임의 바탕·잉크 색 (draw에서 낮/밤 전환값으로 갱신)
  let curInk = INK;
  // 밤 하늘의 별: 고정 시드라 매번 같은 자리 (fx = 가로 비율, fy = 월드 y)
  const NIGHT_STARS = (() => {
    let seed = 20261031;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    };
    return Array.from({ length: 16 }, () => ({ fx: rnd(), fy: 52 + rnd() * 130, r: 0.9 + rnd() * 1.1, ph: rnd() * Math.PI * 2 }));
  })();

  // ===== 캐릭터 그림 =====
  // 실사 흑백 그림: 승인 일러스트의 흑백본 (assets/*_gray.png, 알파 유지, 높이 512).
  // 달리기는 run 1장만 쓰고 bobbing으로 움직인다. 점프 = jump, 충돌 = crash(laugh).
  const PHOTO_FILES = {
    tino: { run: 'tino_run_flip_gray.png', jump: 'tino_jump_v2_gray.png', crash: 'tino_laugh_v2_gray.png' },
    coco: { run: 'coco_run_flip_gray.png', jump: 'coco_jump_v2_gray.png', crash: 'coco_laugh_v2_gray.png' },
  };
  const PHOTOS = {};
  for (const who of CHAR_IDS) {
    PHOTOS[who] = {};
    for (const mode of Object.keys(PHOTO_FILES[who])) {
      const img = new Image();
      img.onload = () => drawPreviews(); // 로드되면 선택 카드도 실사로 다시 그린다
      img.src = 'assets/' + PHOTO_FILES[who][mode];
      PHOTOS[who][mode] = img;
    }
  }

  // ===== 자동 테스트 모드 여부 (?test=1) =====
  const params = new URLSearchParams(window.location.search);
  const TEST_MODE = params.get('test') === '1';
  const NO_JUMP = TEST_MODE && params.get('nojump') === '1';          // 점프 입력을 모두 막는다
  const TEST_MAX_SPEED = TEST_MODE && params.get('speed') === 'max';  // 처음부터 최고 속도로 달린다
  // 스크린샷용: 시작할 때 이 장치를 화면에 띄운다 (테스트 모드에서는 무시)
  const FORCE_ITEM = TEST_MODE ? null : pickParam('forceitem', ['star', 'heart', 'fruit'], null);
  // 스크린샷용: 밤 고정 · 축하 응원 상태 강제 (테스트 모드에서는 무시)
  const FORCE_NIGHT = !TEST_MODE && params.get('forcenight') === '1';
  const FORCE_CHEER = !TEST_MODE && params.get('forcecheer') === '1';

  // ===== DOM =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const finalEl = document.getElementById('final-score');
  const muteBtn = document.getElementById('mute');
  const readyPanel = document.getElementById('ready-panel');
  const overPanel = document.getElementById('over-panel');
  const cards = document.querySelectorAll('.card');
  const speedBtns = document.querySelectorAll('.seg[data-speed]');
  const stage = document.getElementById('stage');
  const sizeBtns = document.querySelectorAll('.seg[data-size]');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const changeBtn = document.getElementById('change-btn');
  const badge = document.getElementById('test-badge');

  // ===== 상태 =====
  let dpr = 1;
  let scale = 1;               // CSS px / 월드 px
  let worldW = 900;            // 현재 화면 너비에 해당하는 월드 너비
  let state = 'ready';         // 'ready' 시작 화면 | 'playing' 진행 중 | 'crashed' 부딪힘
  // 배속: 시작 패널 · 상단 버튼 · 1/2/3 키로 언제든 바꾼다 (setSpeed). 시작·최고 속도와 가속에 곱한다.
  let speedId = TEST_MODE ? pickParam('speedmul', SPEED_IDS, '1') : loadPref(SPEED_KEY, SPEED_IDS, '1');
  let speedMul = Number(speedId);
  // 화면 크기: 저장된 값을 쓴다 (테스트 모드는 기본 normal, ?size= 로만 바꾼다)
  let sizeId = TEST_MODE ? pickParam('size', SIZE_IDS, 'normal') : loadPref(SIZE_KEY, SIZE_IDS, 'normal');
  let distance = 0;            // 달린 거리 (월드 px)
  let score = 0;               // 표시 점수 = floor(distance / SCORE_PX)
  let best = readBest();
  let blinkLeft = 0;           // 100점 깜빡임이 남은 시간
  let speed = startSpeed();
  let scroll = 0;              // 땅 대시 흐름 거리
  let stepClock = 0;           // 다음 다리 프레임 교체까지 남은 시간
  let stepFrame = 0;           // 0 · 1 = 달리기 2프레임
  let obstacles = [];          // { x, w, pieces: [{ dx, w, h, shape }], cleared, arrived }
  let nextGap = 0;             // 마지막 장애물 뒤로 필요한 간격(초)
  let spawnDelay = 0;          // 재시작 후 첫 장애물까지 남은 대기 시간
  let jumpBuffer = 0;          // 공중에서 누른 점프 입력이 남은 시간
  let lift = 0;                // 땅에서 떠 있는 높이
  let vy = 0;                  // 수직 속도
  let grounded = true;
  let crashedAt = 0;
  let jumpLog = null;          // 진행 중인 점프 실측 { speed, time, dist }
  let lastTs = null;
  let muted = false;
  let audioCtx = null;         // 첫 사용자 입력 뒤에만 만든다
  let selected = loadChoice(); // 'tino' | 'coco' | null (아직 안 고름)
  // 중간 장치 상태 (이번 판 기준. startGame에서 초기화)
  let stars = 0;               // 모은 별 개수
  let shield = 0;              // 보유한 방패 (최대 1)
  let invulnLeft = 0;          // 방패가 깨진 뒤 무적 남은 시간
  let items = [];              // 화면 위 장치 { kind: 'star' | 'heart', x, y, w, h, taken }
  let itemClock = 0;           // 다음 장치가 나올 때까지 남은 시간
  let effects = [];            // 깨짐·반짝임 조각 { x, y, vx, vy, life, color }
  let clockT = 0;              // 애니메이션 시계 (반짝임·깜빡임용)
  let fruits = 0;              // 이번 판 과일 개수
  let nightMix = 0;            // 0 = 낮, 1 = 밤 (전환 중에는 사이값)
  let flowers = [];            // 꽃길 { x, grow, color }
  let flowerLeft = 0;          // 다음 꽃까지 남은 월드 px
  let flowerSeq = 0;           // 꽃 색 순환 번호
  let celebs = [];             // 축하 파티클 { x, y, vx, vy, life, color, star }
  let celebCheerLeft = 0;      // 축하 응원이 남은 시간
  let startCheer = null;       // 출발 응원 { x } (월드 좌표, 왼쪽으로 흘러간다)

  // 자동 테스트 결과
  let testDone = false;
  let testElapsed = 0;
  let passedCount = 0;         // 충돌 없이 넘은 장애물 수
  const testResult = { status: 'RUNNING', char: null, score: 0, reason: '' };
  const measuredJumps = [];    // 테스트 중 실제 점프 실측 기록
  const gapLog = [];           // 테스트 중 장애물 사이 시간 간격 실측(초)
  let lastClearAt = null;

  // ===== 화면 크기 =====
  function resize() {
    const cssW = wrap.clientWidth;
    // 높이는 가로 비율을 따르되 크기별 범위로 제한 (전체는 창 높이에서 맞춘다)
    const [minH, maxH] = SIZE_H[sizeId];
    const wantH = sizeId === 'full' ? window.innerHeight - SIZE_FULL_OFFSET : cssW * 0.42;
    const cssH = Math.round(Math.min(maxH, Math.max(minH, wantH)));
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = cssH / WORLD_H;
    worldW = cssW / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }

  // 화면 크기 적용: 컨테이너 폭(CSS 클래스)을 바꾸고 캔버스를 다시 맞춘다. 게임 상태는 건드리지 않는다
  function applySize() {
    stage.className = 'size-' + sizeId;
    resize();
  }

  // ===== 저장 (실패해도 게임은 그대로 동작) =====
  function readBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch (err) {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  function loadChoice() {
    if (TEST_MODE) {
      const forced = params.get('char');
      return CHAR_IDS.includes(forced) ? forced : 'tino';
    }
    try {
      const saved = localStorage.getItem(CHAR_KEY);
      return CHAR_IDS.includes(saved) ? saved : null;
    } catch (err) {
      return null;
    }
  }

  function saveChoice(value) {
    if (TEST_MODE) return; // 테스트는 저장된 선택을 건드리지 않는다
    try {
      localStorage.setItem(CHAR_KEY, value);
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  // 배속 설정 (저장된 값이 없거나 이상하면 기본값)
  function loadPref(key, allowed, fallback) {
    try {
      const saved = localStorage.getItem(key);
      return allowed.includes(saved) ? saved : fallback;
    } catch (err) {
      return fallback;
    }
  }

  function savePref(key, value) {
    if (TEST_MODE) return; // 테스트는 저장된 설정을 건드리지 않는다
    try {
      localStorage.setItem(key, value);
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  // 테스트용 URL 파라미터 (허용되지 않은 값이면 기본값)
  function pickParam(name, allowed, fallback) {
    const v = params.get(name);
    return allowed.includes(v) ? v : fallback;
  }

  // ===== 소리 (WebAudio 신스, 외부 파일 없음) =====
  function initAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) {
      audioCtx = null;
    }
  }

  // 주파수가 f0에서 f1로 미끄러지는 짧은 음 하나
  // delay(초)만큼 뒤에 울린다. 여러 음을 예약할 때 setTimeout 대신 오디오 시계로 맞춘다
  function tone(type, f0, f1, dur, vol, delay) {
    if (muted || !audioCtx || audioCtx.state !== 'running') return;
    try {
      const t0 = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t0);
      osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (err) {
      // 소리 실패는 게임 진행에 영향 없게 무시
    }
  }

  const sfxJump = () => tone('triangle', 520, 980, 0.16, 0.25);  // 점프
  const sfxBlip = () => tone('square', 1320, 1320, 0.09, 0.08);  // 100점 블립
  const sfxCrash = () => tone('sawtooth', 320, 60, 0.45, 0.2);   // 충돌
  const sfxStar = () => tone('triangle', 900, 1800, 0.14, 0.22); // 별 수집
  const sfxHeart = () => tone('sine', 660, 990, 0.22, 0.25);     // 방패 획득
  const sfxBreak = () => tone('square', 480, 120, 0.2, 0.14);    // 방패 파손 · 돌멩이 깨짐
  const sfxFruit = () => { tone('sine', 500, 620, 0.08, 0.22); tone('sine', 680, 760, 0.1, 0.22, 0.09); }; // 과일 뽁-뽕
  const sfxFanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, i < 3 ? 0.1 : 0.3, 0.18, i * 0.09)); // 축하 팡파레
  const sfxNight = () => tone('sine', 1319, 1319, 0.5, 0.05);   // 밤 전환 종소리 (볼륨 0.06 이하)

  // ===== 물리 (v4 코어 유지) =====
  // 배속: 시작·최고 속도와 가속(속도 곡선 전체)에 곱한다. 체공 시간은 그대로라 점프 수평거리만 속도에 비례해 커진다.
  function startSpeed() {
    return START_SPEED * speedMul;
  }

  function maxSpeed() {
    return MAX_SPEED * speedMul;
  }

  function speedEase() {
    return SPEED_EASE * speedMul;
  }

  // 배속 변경 (시작 패널 · 상단 버튼 · 1/2/3 키 공통). 진행 중이면 현재 속도도 같은 비율로 바꾼다.
  // 속도가 배속과 같은 비율로 움직이므로 체공 시간은 그대로이고 점프 수평거리만 속도에 비례해 달라진다.
  function setSpeed(id) {
    if (id === speedId) return;
    const next = Number(id);
    speed = speed * next / speedMul;
    speedMul = next;
    speedId = id;
    savePref(SPEED_KEY, id);
    renderChoice();
  }

  // 화면 크기 변경 (상단 버튼 공통). 캔버스 밖 HTML 버튼이라 점프와 섞이지 않는다.
  // 월드 좌표(장애물·장치·꽃)는 그대로이고 축척만 바뀐다. 캐릭터는 월드 x에 고정이라 화면 안에 남는다.
  function setSize(id) {
    if (id === sizeId) return;
    sizeId = id;
    savePref(SIZE_KEY, id);
    applySize();
    renderChoice();
  }

  // 속도 → 체공 시간: 시작 속도 AIR_T_START에서 최고 속도 AIR_T_MAX까지 직선으로
  function airTimeFor(v) {
    const k = Math.min(1, Math.max(0, (v - startSpeed()) / (maxSpeed() - startSpeed())));
    return AIR_T_START + (AIR_T_MAX - AIR_T_START) * k;
  }

  // 점프 초기속도 = g·T/2 (T = 지금 속도에서의 체공 시간)
  function jumpVelocityFor(v) {
    return GRAVITY * airTimeFor(v) / 2;
  }

  // 거리 점수에 따라 정해지는 목표 속도 (최고 속도에서 고정)
  function targetSpeedFor(s) {
    if (TEST_MAX_SPEED) return maxSpeed();
    const k = Math.min(1, Math.max(0, s / SPEED_FULL_SCORE));
    return startSpeed() + (maxSpeed() - startSpeed()) * k;
  }

  // 점프 중 위치와 착지 처리. 공중에서는 점프 입력을 무시하므로 이중 점프가 없다.
  function updateJump(dt) {
    if (grounded) return;
    vy -= GRAVITY * dt;
    lift += vy * dt;
    if (jumpLog) {
      jumpLog.time += dt;
      if (state === 'playing') jumpLog.dist += speed * dt;
    }
    if (lift <= 0) {
      lift = 0;
      vy = 0;
      grounded = true;
      landed();
      if (jumpBuffer > 0) {
        // 착지 직전에 누른 입력: 착지하자마자 바로 다시 점프
        jumpBuffer = 0;
        jump();
      }
    }
  }

  function jump() {
    if (!grounded || NO_JUMP) return;
    grounded = false;
    vy = jumpVelocityFor(speed);
    jumpLog = { speed: speed, time: 0, dist: 0 };
    sfxJump();
  }

  // 착지: 실측 기록 (테스트 모드에서만)
  function landed() {
    if (jumpLog && TEST_MODE && state === 'playing') {
      measuredJumps.push({
        speed: Math.round(jumpLog.speed),
        airTime: +jumpLog.time.toFixed(3),
        dist: +jumpLog.dist.toFixed(1),
      });
    }
    jumpLog = null;
  }

  // ===== 충돌 박스 =====
  function playerBox() {
    return { x: PLAYER_X, y: GROUND_Y - lift - DISPLAY_H, w: CHAR_W, h: DISPLAY_H };
  }

  // 판정 박스: 왼쪽·오른쪽·위쪽을 주어진 비율만큼 안쪽으로 줄인다 (발끝은 그대로)
  function hitBox(r, insetX, insetTop) {
    return {
      x: r.x + r.w * insetX,
      y: r.y + r.h * insetTop,
      w: r.w * (1 - 2 * insetX),
      h: r.h * (1 - insetTop),
    };
  }

  function playerHit() {
    return hitBox(playerBox(), PLAYER_INSET.x, PLAYER_INSET.top);
  }

  // 돌멩이 한 개의 판정 박스
  function pieceHit(o, p) {
    return hitBox({ x: o.x + p.dx, y: GROUND_Y - p.h, w: p.w, h: p.h }, ROCK_INSET.x, ROCK_INSET.top);
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ===== 화면 패널 (시작 / 종료) =====
  function showPanel(name) {
    readyPanel.hidden = name !== 'ready';
    overPanel.hidden = name !== 'crashed';
  }

  function renderChoice() {
    for (const card of cards) {
      card.setAttribute('aria-pressed', String(card.dataset.char === selected));
    }
    for (const btn of speedBtns) {
      btn.setAttribute('aria-pressed', String(btn.dataset.speed === speedId));
    }
    for (const btn of sizeBtns) {
      btn.setAttribute('aria-pressed', String(btn.dataset.size === sizeId));
    }
    startBtn.disabled = !selected;
    drawPreviews();
  }

  // ===== 게임 흐름 =====
  function pad5(n) {
    return String(Math.min(n, SCORE_MAX)).padStart(5, '0');
  }

  function startGame() {
    state = 'playing';
    distance = 0;
    score = 0;
    blinkLeft = 0;
    speed = targetSpeedFor(0);
    obstacles = [];
    nextGap = 0;
    spawnDelay = FIRST_DELAY;
    jumpBuffer = 0;
    stars = 0;
    shield = 0;
    invulnLeft = 0;
    effects = [];
    items = [];
    itemClock = randomItemGap();
    if (FORCE_ITEM) spawnItem(FORCE_ITEM, worldW * 0.7); // 스크린샷용: 화면 안쪽에 미리 띄운다
    fruits = 0;
    nightMix = isNightAt(0) ? 1 : 0;   // 새 판은 낮에서 시작 (밤 고정이면 밤)
    flowers = [];
    flowerLeft = 0;
    celebs = [];
    celebCheerLeft = 0;
    // 출발 응원: 선택한 친구 왼쪽 뒤에서 응원하다 세계가 흐르며 화면 밖으로 나간다 (테스트 모드에서는 끔)
    startCheer = TEST_MODE ? null : { x: PLAYER_X - 40 };
    showPanel(null);
  }

  // 시작 화면으로 돌아가 캐릭터를 다시 고를 수 있게 한다
  function goReady() {
    state = 'ready';
    distance = 0;
    score = 0;
    obstacles = [];
    nextGap = 0;
    jumpBuffer = 0;
    showPanel('ready');
    renderChoice();
  }

  // 캐릭터를 고른 뒤에만 출발한다 (첫 점프까지 함께)
  function beginRun() {
    if (!selected) return;
    initAudio();
    startGame();
    jump();
  }

  function crash() {
    state = 'crashed';
    crashedAt = performance.now();
    jumpBuffer = 0;
    if (score > best) {
      best = score;
      writeBest(best);
    }
    finalEl.textContent = pad5(score);
    showPanel('crashed');
    sfxCrash();
    if (TEST_MODE && !testDone) finishTest('FAIL', '충돌 (점수 ' + score + ', 통과 ' + passedCount + '개)');
  }

  // 돌멩이 한 덩이 (1개 · 2개 붙음 · 3개 붙음)
  function makeRock(x) {
    const r = Math.random();
    const count = r < 0.5 ? 1 : (r < 0.85 ? 2 : 3);
    const pieces = [];
    let dx = 0;
    for (let i = 0; i < count; i++) {
      const w = ROCK_W[0] + Math.random() * (ROCK_W[1] - ROCK_W[0]);
      const h = ROCK_H[0] + Math.random() * (ROCK_H[1] - ROCK_H[0]);
      pieces.push({ dx: dx, w: w, h: h, shape: ROCK_SHAPES[Math.floor(Math.random() * ROCK_SHAPES.length)] });
      dx += w - CLUSTER_OVERLAP;
    }
    const last = pieces[pieces.length - 1];
    return { x: x, w: last.dx + last.w, pieces: pieces, cleared: false, arrived: false, broken: false };
  }

  // 시간 기준 스폰: 앞 장애물 꼬리가 지나간 뒤 다음 장애물 머리가 오기까지 nextGap초 이상.
  // 간격 거리는 현재 속도로 잡되, 그 사이 속도가 가속(speedEase)으로 오르는 최악의 경우까지 더해 시간 간격을 보장한다.
  function maybeSpawn() {
    if (spawnDelay > 0) return;
    const last = obstacles[obstacles.length - 1];
    if (last) {
      const need = nextGap * speed + 0.5 * speedEase() * nextGap * nextGap;
      if (worldW + 10 - (last.x + last.w) < need) return;
    }
    // 방금 나온 장치가 스폰 지점에서 충분히 떨어질 때까지 기다린다 (장치와 겹쳐 나오지 않게)
    if (items.some(i => i.x + i.w + ITEM_SAFE > worldW + 10)) return;
    obstacles.push(makeRock(worldW + 10));
    nextGap = GAP_MIN_SEC + Math.random() * GAP_RANDOM_SEC;
  }

  // ===== 중간 장치 =====
  function randomItemGap() {
    return ITEM_GAP_SEC[0] + Math.random() * (ITEM_GAP_SEC[1] - ITEM_GAP_SEC[0]);
  }

  // 별은 점프 궤적 위(공중), 하트는 지면 위. 장치 판정 박스 = 그림 크기
  function spawnItem(kind, x) {
    if (kind === 'fruit') {
      // 과일은 지면 근처: 달리기 자세 그대로 닿는다 (별은 공중, 하트는 지면)
      const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
      items.push({ kind: 'fruit', type: type, x: x, y: GROUND_Y - 2 - FRUIT_SIZE, w: FRUIT_SIZE, h: FRUIT_SIZE, taken: false, phase: Math.random() * Math.PI * 2 });
      return;
    }
    const isStar = kind === 'star';
    const size = isStar ? STAR_SIZE : HEART_SIZE;
    const y = isStar ? STAR_Y - STAR_SIZE / 2 : GROUND_Y - HEART_SIZE;
    items.push({ kind: kind, x: x, y: y, w: size, h: size, taken: false });
  }

  // 장치는 화면에 하나뿐이고, 직전 장애물이 스폰 지점에서 떨어져 있을 때만 나온다. 테스트 모드에서는 내지 않는다.
  function maybeSpawnItem(dt) {
    if (TEST_MODE) return;
    itemClock -= dt;
    if (itemClock > 0 || items.length) return;
    const last = obstacles[obstacles.length - 1];
    if (last && worldW + 10 - (last.x + last.w) < ITEM_SAFE) return;
    spawnItem(pickItemKind(), worldW + 10);
    itemClock = randomItemGap();
  }

  function takeItem(it) {
    it.taken = true;
    const cx = it.x + it.w / 2;
    const cy = it.y + it.h / 2;
    if (it.kind === 'star') {
      stars += 1;
      distance += STAR_POINTS * SCORE_PX; // 점수에 더한다
      burst(cx, cy, STAR_COLOR, 12);
      sfxStar();
    } else if (it.kind === 'fruit') {
      fruits += 1;
      distance += FRUIT_POINTS * SCORE_PX;
      burst(cx, cy, FRUIT_COLORS[it.type], 7);
      sfxFruit();
    } else {
      shield = 1;
      burst(cx, cy, HEART_COLOR, 10);
      sfxHeart();
    }
  }

  // 돌멩이가 깨진다: 조각이 흩어지고 더 이상 판정되지 않는다
  function breakRock(o) {
    o.broken = true;
    burst(o.x + o.w / 2, GROUND_Y - 20, curInk, 10);
    sfxBreak();
  }

  // 조각·반짝임 (짧게 사라진다). 게임이 달리는 동안에는 세계와 같이 흐른다
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 80 + Math.random() * 140;
      effects.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.45, color: color });
    }
  }

  function updateEffects(dt) {
    for (const e of effects) {
      e.life -= dt;
      e.vy += 600 * dt;
      e.x += e.vx * dt - (state === 'playing' ? speed * dt : 0);
      e.y += e.vy * dt;
    }
    effects = effects.filter(e => e.life > 0);
  }

  // 달리기 프레임 교체. 빠를수록 교체 주기가 짧다
  function updateStep(dt) {
    if (!grounded) return;
    stepClock -= dt;
    if (stepClock > 0) return;
    const k = Math.min(1, Math.max(0, (speed - startSpeed()) / (maxSpeed() - startSpeed())));
    stepClock += STEP_SLOW + (STEP_FAST - STEP_SLOW) * k;
    if (stepClock < 0) stepClock = 0;
    stepFrame = 1 - stepFrame;
  }

  // 자동 테스트 조종사: 가장 가까운 장애물이 가까워지면 점프 (?test=1 전용, nojump 모드에서는 끔)
  function autoPilot() {
    if (!TEST_MODE || NO_JUMP || testDone || !grounded) return;
    const next = obstacles.find(o => !o.cleared);
    if (!next) return;
    const hit = playerHit();
    const first = pieceHit(next, next.pieces[0]);
    const dist = first.x - (hit.x + hit.w);
    if (dist <= speed * AUTOPILOT_LEAD) jump();
  }

  function updatePlaying(dt) {
    speed = Math.min(targetSpeedFor(score), speed + speedEase() * dt);
    const d = speed * dt;
    distance += d;
    const next = Math.floor(distance / SCORE_PX);
    const hundredUp = Math.floor(next / 100) > Math.floor(score / 100);
    const milestoneUp = Math.floor(next / MILESTONE) > Math.floor(score / MILESTONE);
    const nightWas = isNightAt(score);
    if (hundredUp) blinkLeft = BLINK_SEC;   // 100점마다 숫자 깜빡
    if (milestoneUp) celebrate();           // 500점 배수: 팡파레가 100점 블립을 대신한다
    else if (hundredUp) sfxBlip();
    if (isNightAt(next) !== nightWas) sfxNight();
    score = next;
    spawnDelay = Math.max(0, spawnDelay - dt);
    maybeSpawn();
    for (const o of obstacles) o.x -= d;
    for (const it of items) it.x -= d;
    for (const f of flowers) f.x -= d;
    if (startCheer) {
      startCheer.x -= d;
      if (startCheer.x < -60) startCheer = null;
    }
    flowerLeft -= d;
    if (flowerLeft <= 0) {
      spawnFlower();
      flowerLeft = FLOWER_GAP[0] + Math.random() * (FLOWER_GAP[1] - FLOWER_GAP[0]);
    }

    const hit = playerHit();
    for (const o of obstacles) {
      // 시간 간격 실측: 앞 장애물 꼬리가 기준선을 지난 시각 → 다음 장애물 머리가 같은 기준선에 닿은 시각
      if (TEST_MODE && !o.arrived && o.x < hit.x) {
        o.arrived = true;
        if (lastClearAt !== null) gapLog.push(+(testElapsed - lastClearAt).toFixed(3));
      }
      if (!o.broken && o.pieces.some(p => overlap(hit, pieceHit(o, p)))) {
        if (invulnLeft > 0) {
          breakRock(o);                       // 무적 중: 돌멩이가 깨지며 지나간다
        } else if (shield > 0) {
          shield = 0;                         // 방패가 대신 깨지고 짧은 무적이 시작된다
          invulnLeft = INVULN_SEC;
          burst(hit.x + hit.w / 2, hit.y + hit.h / 2, HEART_COLOR, 10);
          breakRock(o);
        } else {
          crash();
          return;
        }
      }
      // 장애물 오른쪽 끝이 판정 왼쪽 끝을 지나면 = 넘은 것
      if (!o.cleared && o.x + o.w < hit.x) {
        o.cleared = true;
        passedCount += 1;
        lastClearAt = testElapsed;
        if (TEST_MODE && !testDone && passedCount >= TEST_GOAL) finishTest('PASS', '충돌 없이 ' + passedCount + '개 넘음');
      }
    }
    for (const it of items) {
      if (!it.taken && overlap(hit, it)) takeItem(it);
    }
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    items = items.filter(it => !it.taken && it.x + it.w > -20);
    flowers = flowers.filter(f => f.x > -20);
    if (blinkLeft > 0) blinkLeft = Math.max(0, blinkLeft - dt);
    if (invulnLeft > 0) invulnLeft = Math.max(0, invulnLeft - dt);
  }

  function update(dt) {
    updateJump(dt);
    if (jumpBuffer > 0) jumpBuffer = Math.max(0, jumpBuffer - dt);
    clockT += dt;
    updateEffects(dt);
    updateCelebs(dt);
    for (const f of flowers) f.grow = Math.min(1, f.grow + dt / 0.3); // 꽃이 0.3초에 걸쳐 핀다
    if (celebCheerLeft > 0) celebCheerLeft = Math.max(0, celebCheerLeft - dt);
    const step = dt / NIGHT_FADE_SEC; // 낮/밤 색은 경계에서 약 0.6초에 걸쳐 바뀐다
    nightMix += Math.max(-step, Math.min(step, (isNightAt(score) ? 1 : 0) - nightMix));
    if (state === 'playing') {
      autoPilot();
      updatePlaying(dt);
      maybeSpawnItem(dt);
      updateStep(dt);
      if (TEST_MODE && !testDone) {
        testElapsed += dt;
        if (testElapsed > TEST_TIMEOUT) finishTest('FAIL', '시간 초과');
      }
    }
    // crashed: 세계는 멈추고, 캐릭터는 착지까지만 updateJump로 떨어진다
  }

  // 같은 물리 코드(updateJump와 같은 식)를 고정 dt로 돌려 한 번의 점프를 잰다
  function simulateJump(v, dt) {
    let y = 0;
    let vv = jumpVelocityFor(v);
    let t = 0;
    let peak = 0;
    do {
      vv -= GRAVITY * dt;
      y += vv * dt;
      t += dt;
      peak = Math.max(peak, y);
    } while (y > 0);
    return { airTime: +t.toFixed(3), dist: +(v * t).toFixed(1), peak: +peak.toFixed(1) };
  }

  // 점프 수평거리 ÷ 필요 클리어 거리(캐릭터 판정 폭 + 가장 긴 돌멩이 덩이 판정 폭)
  function physicsReport() {
    const charHitW = playerHit().w;
    const maxClusterW = 3 * ROCK_W[1] - 2 * CLUSTER_OVERLAP;
    const obstHitW = maxClusterW * (1 - 2 * ROCK_INSET.x);
    const need = charHitW + obstHitW;
    const at = v => {
      const s = simulateJump(v, 1 / 60);
      return Object.assign({ speed: v, ratio: +(s.dist / need).toFixed(2) }, s);
    };
    const report = {
      startSpeed: startSpeed(),
      maxSpeed: maxSpeed(),
      speedMul: speedMul,
      gravity: GRAVITY,
      clearNeed: +need.toFixed(1),
      charHitW: +charHitW.toFixed(1),
      obstacleHitWMax: +obstHitW.toFixed(1),
      sim: { start: at(startSpeed()), max: at(maxSpeed()) },
    };
    if (measuredJumps.length) {
      const ratios = measuredJumps.map(j => j.dist / need);
      report.measured = {
        jumps: measuredJumps.slice(),
        airTimeMin: Math.min(...measuredJumps.map(j => j.airTime)),
        airTimeMax: Math.max(...measuredJumps.map(j => j.airTime)),
        ratioMin: +Math.min(...ratios).toFixed(2),
      };
    }
    if (gapLog.length) report.gapSecMin = Math.min(...gapLog);
    return report;
  }

  // 자동 테스트 결과를 화면 구석, console, document.title, window.__TEST_RESULT 에 남긴다
  function finishTest(status, reason) {
    testDone = true;
    testResult.status = status;
    testResult.char = selected;
    testResult.speedMul = speedMul;
    testResult.score = score;
    testResult.passed = passedCount;
    testResult.reason = reason;
    testResult.speedMode = TEST_MAX_SPEED ? 'max' : 'start';
    testResult.speedNow = Math.round(speed);
    testResult.physics = physicsReport();
    window.__TEST_RESULT = Object.assign({}, testResult);
    const line = '[TEST ' + status + '] ' + CHAR_NAMES[selected] + ' 통과 ' + passedCount + '/' + TEST_GOAL + ' · ' + reason;
    document.title = line;
    badge.textContent = line;
    badge.dataset.status = status;
    console.log(line, window.__TEST_RESULT);
  }

  // ===== 4차 연출 · 보상 =====
  // 700점마다 낮/밤 (FORCE_NIGHT면 항상 밤)
  function isNightAt(s) {
    return FORCE_NIGHT || Math.floor(s / NIGHT_SEC) % 2 === 1;
  }

  // 500점 배수를 넘었을 때: 파티클 폭죽 (최대 40개) + 팡파레 + 응원 캐릭터. 게임은 멈추지 않는다
  function celebrate() {
    const cx = PLAYER_X + CHAR_W / 2;
    const cy = GROUND_Y - lift - DISPLAY_H / 2;
    const n = Math.min(30, CELEB_MAX - celebs.length);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 120 + Math.random() * 160;
      celebs.push({
        x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: CELEB_SEC,
        color: CELEB_COLORS[i % CELEB_COLORS.length], star: i % 2 === 0,
      });
    }
    sfxFanfare();
    if (!TEST_MODE) celebCheerLeft = CHEER_SEC;
  }

  function updateCelebs(dt) {
    for (const p of celebs) {
      p.life -= dt;
      p.vy += 300 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    celebs = celebs.filter(p => p.life > 0);
  }

  function spawnFlower() {
    if (flowers.length >= FLOWER_MAX) return;
    flowers.push({ x: worldW + 10, grow: 0, color: FLOWER_COLORS[flowerSeq % FLOWER_COLORS.length] });
    flowerSeq += 1;
  }

  // 장치 종류 뽑기: ITEM_WEIGHTS 비율
  function pickItemKind() {
    let r = Math.random() * (ITEM_WEIGHTS.star + ITEM_WEIGHTS.fruit + ITEM_WEIGHTS.heart);
    if ((r -= ITEM_WEIGHTS.star) < 0) return 'star';
    if ((r -= ITEM_WEIGHTS.fruit) < 0) return 'fruit';
    return 'heart';
  }

  // 두 색(#rrggbb)을 t(0~1)만큼 섞는다. 낮/밤 전환용
  function mixColor(a, b, t) {
    const out = [1, 3, 5].map(i => {
      const va = parseInt(a.slice(i, i + 2), 16);
      const vb = parseInt(b.slice(i, i + 2), 16);
      return Math.round(va + (vb - va) * t);
    });
    return 'rgb(' + out.join(',') + ')';
  }

  // ===== 입력 =====
  function onAction() {
    initAudio();
    if (state === 'ready') {
      beginRun();
    } else if (state === 'playing') {
      if (grounded) jump();
      else jumpBuffer = JUMP_BUFFER; // 공중 입력은 잠깐 기억해 두었다가 착지 순간 점프
    } else if (state === 'crashed' && performance.now() - crashedAt > RESTART_LOCK_MS) {
      beginRun();
    }
  }

  function isJumpKey(e) {
    return e.code === 'Space' || e.code === 'ArrowUp';
  }

  window.addEventListener('keydown', e => {
    if (SPEED_KEYS[e.code]) {                 // 1 · 2 · 3 = 배속 (점프와 무관)
      if (!e.repeat) setSpeed(SPEED_KEYS[e.code]);
      return;
    }
    if (!isJumpKey(e)) return;
    e.preventDefault(); // 페이지 스크롤 방지
    // 포커스된 버튼(카드·다시 하기 등)이 스페이스바로 한 번 더 눌리지 않게 포커스를 뺀다
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
      document.activeElement.blur();
    }
    if (!e.repeat) onAction(); // 누르고 있어도 한 번만
  });

  window.addEventListener('keyup', e => {
    if (isJumpKey(e)) e.preventDefault();
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    onAction();
  });

  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  for (const card of cards) {
    card.addEventListener('click', () => {
      selected = card.dataset.char;
      saveChoice(selected);
      renderChoice();
    });
  }

  for (const btn of speedBtns) {
    btn.addEventListener('click', () => setSpeed(btn.dataset.speed));
  }

  for (const btn of sizeBtns) {
    btn.addEventListener('click', () => setSize(btn.dataset.size));
  }

  startBtn.addEventListener('click', beginRun);
  retryBtn.addEventListener('click', beginRun);
  changeBtn.addEventListener('click', goReady);

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
    muteBtn.blur(); // 포커스가 남아 스페이스바가 버튼을 누르지 않도록
  });

  // 실사 흑백 그림이 준비됐는지 (로드 전에는 그리지 않는다)
  function photoReady(who, mode) {
    const img = PHOTOS[who][mode];
    return img.complete && img.naturalWidth > 0;
  }

  // 실사 흑백: 발끝(footY)에 맞춰 높이 h로 가운데(cx) 정렬한다. 달리기 2프레임 중 한쪽에서만 2px 위로 튄다 (bobbing)
  function drawPhoto(c, who, mode, legPhase, cx, footY, h) {
    const key = mode === 'crash' ? 'crash' : (mode === 'jump' ? 'jump' : 'run');
    const img = PHOTOS[who][key];
    const bob = key === 'run' && legPhase === 1 ? 2 : 0;
    const w = img.naturalWidth * h / img.naturalHeight;
    c.drawImage(img, cx - w / 2, footY - h - bob, w, h);
  }

  // 게임 좌표에서 캐릭터를 그린다. x = 박스 왼쪽, footY = 발끝 y (땅이면 GROUND_Y)
  // 판정 박스(CHAR_W x DISPLAY_H)와 같은 높이·가운데 기준으로 맞춘다
  function drawCharacter(c, x, footY, who, legPhase, mode) {
    if (photoReady(who, mode)) drawPhoto(c, who, mode, legPhase, x + CHAR_W / 2, footY, DISPLAY_H);
  }

  // 시작 패널 미리보기: 달리기 자세의 실사 흑백 그림 (2배 해상도)
  function drawPreviews() {
    for (const pv of document.querySelectorAll('canvas.preview')) {
      const pc = pv.getContext('2d');
      const who = pv.dataset.preview;
      pc.setTransform(2, 0, 0, 2, 0, 0);
      pc.fillStyle = PAPER;
      pc.fillRect(0, 0, PREVIEW_W, PREVIEW_H);
      if (photoReady(who, 'run')) drawPhoto(pc, who, 'run', 0, PREVIEW_W / 2, PREVIEW_H, PREVIEW_H);
    }
  }

  // ===== 그리기 =====
  function wrapX(base, offset, tile) {
    return ((base - offset) % tile + tile) % tile;
  }

  function drawGround() {
    ctx.fillStyle = curInk;
    ctx.fillRect(0, GROUND_Y, worldW, 2);
    ctx.globalAlpha = 0.5;
    for (const d of DASHES) {
      for (let x = wrapX(d.x, scroll, DASH_TILE) - DASH_TILE; x < worldW; x += DASH_TILE) {
        ctx.fillRect(x, d.y, d.len, 1.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  // 밤 하늘: 고정 자리의 작은 별(약하게 깜빡) + 초승달 (겹친 원으로 달 모양). t = 밤 정도 (0~1)
  function drawSky(t) {
    for (const s of NIGHT_STARS) {
      ctx.globalAlpha = t * (0.55 + 0.35 * Math.sin(clockT * 1.6 + s.ph));
      ctx.beginPath();
      ctx.arc(s.fx * worldW, s.fy, s.r, 0, Math.PI * 2);
      ctx.fillStyle = '#F4F1E4';
      ctx.fill();
    }
    const mx = worldW - 96;
    const my = 78;
    ctx.globalAlpha = t;
    ctx.beginPath();
    ctx.arc(mx, my, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#F6EFCF';
    ctx.fill();
    ctx.beginPath();                       // 바탕색 원을 겹쳐 초승달로 깎는다
    ctx.arc(mx + 7, my - 4, 13, 0, Math.PI * 2);
    ctx.fillStyle = curPaper;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 밤에 캐릭터가 묻히지 않도록 뒤에 연한 원형 후광
  function drawHalo(t) {
    const cx = PLAYER_X + CHAR_W / 2;
    const cy = GROUND_Y - lift - DISPLAY_H / 2;
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 58);
    g.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
    g.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.globalAlpha = t;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, 58, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 꽃길 한 송이: 5잎 원형 + 노란 중심. 0.3초에 걸쳐 핀다
  function drawFlower(f) {
    if (f.x < -20 || f.x > worldW + 20 || f.grow <= 0) return;
    ctx.save();
    ctx.translate(f.x, GROUND_Y - 5);
    ctx.scale(f.grow, f.grow);
    ctx.fillStyle = f.color;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 3.6, Math.sin(a) * 3.6, 2.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = FLOWER_CENTER;
    ctx.fill();
    ctx.restore();
  }

  // 응원 캐릭터 (laugh 자세). 위아래로 까딱이며 응원한다
  function drawCheer(who, cx, footY, h, alpha) {
    if (!photoReady(who, 'crash')) return;
    const img = PHOTOS[who].crash;
    const w = img.naturalWidth * h / img.naturalHeight;
    const up = Math.abs(Math.sin(clockT * 7)) * 2.5;
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, cx - w / 2, footY - h - up, w, h);
    ctx.globalAlpha = 1;
  }

  // 선택하지 않은 쌍둥이의 응원. 출발 응원은 세계와 같이 흐르고, 축하 응원은 오른쪽 아래에 잠깐 나온다
  function drawCheers() {
    const other = selected === 'tino' ? 'coco' : 'tino';
    if (startCheer) drawCheer(other, startCheer.x, GROUND_Y, DISPLAY_H * CHEER_START_SIZE, 1);
    if (FORCE_CHEER || celebCheerLeft > 0) {
      const fade = FORCE_CHEER ? 1 : Math.min(1, celebCheerLeft / 0.25, (CHEER_SEC - celebCheerLeft) / 0.15);
      drawCheer(other, worldW - 40, GROUND_Y, DISPLAY_H * CHEER_CELEB_SIZE, fade);
    }
  }

  // 축하 파티클: 별·동그라미 (약 1초에 사라진다)
  function drawCelebs() {
    for (const p of celebs) {
      ctx.globalAlpha = Math.max(0, p.life / CELEB_SEC);
      ctx.fillStyle = p.color;
      if (p.star) {
        starPath(p.x, p.y, 5, 2.2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // 과일 그림 (원점 기준). 장치와 HUD 아이콘이 같이 쓴다
  function drawFruitShape(type) {
    const leaf = (x, y) => {
      ctx.beginPath();
      ctx.ellipse(x, y, 3.8, 2, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#4CAF6A';
      ctx.fill();
    };
    if (type === 'grape') {
      ctx.fillStyle = FRUIT_COLORS.grape;
      for (const [x, y] of [[-4.5, -5.5], [0, -5.5], [4.5, -5.5], [-2.3, -0.5], [2.3, -0.5], [0, 4.5]]) {
        ctx.beginPath();
        ctx.arc(x, y, 3.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = '#7A4B2A';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -9.5);
      ctx.lineTo(0.5, -11.5);
      ctx.stroke();
      leaf(4.5, -10);
      return;
    }
    ctx.beginPath();
    ctx.arc(0, 1.5, 9.5, 0, Math.PI * 2);
    ctx.fillStyle = type === 'orange' ? FRUIT_COLORS.orange : FRUIT_COLORS.apple;
    ctx.fill();
    if (type === 'apple') {
      ctx.strokeStyle = '#7A4B2A';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -7.5);
      ctx.lineTo(1.2, -11);
      ctx.stroke();
    }
    leaf(4, -9);
  }

  // 과일 장치: 가벼운 링(장애물 돌멩이와 구분) + 흰 반짝임, 둥실거린다
  function drawFruit(it) {
    const cx = it.x + it.w / 2;
    const cy = it.y + it.h / 2 + Math.sin(clockT * 3 + it.phase) * 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.arc(0, 0, FRUIT_SIZE / 2 + 2, 0, Math.PI * 2);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = curInk;
    ctx.globalAlpha = 0.45;
    ctx.stroke();
    ctx.globalAlpha = 1;
    drawFruitShape(it.type);
    ctx.beginPath();
    ctx.arc(-4, -5, 1.6, 0, Math.PI * 2);
    ctx.fillStyle = PAPER;
    ctx.fill();
    ctx.restore();
  }

  // 돌멩이 덩이: 덩이마다 1~3개의 각진 폴리곤을 단색으로
  function drawRock(o) {
    ctx.fillStyle = curInk;
    for (const p of o.pieces) {
      ctx.beginPath();
      p.shape.forEach((pt, i) => {
        const x = o.x + p.dx + pt[0] * p.w;
        const y = GROUND_Y - pt[1] * p.h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    }
  }

  // 별 모양 · 하트 모양 경로 (중심 cx, cy)
  function starPath(cx, cy, outer, inner) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function heartPath(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.42);
    ctx.bezierCurveTo(cx - s * 0.62, cy + s * 0.02, cx - s * 0.5, cy - s * 0.5, cx, cy - s * 0.18);
    ctx.bezierCurveTo(cx + s * 0.5, cy - s * 0.5, cx + s * 0.62, cy + s * 0.02, cx, cy + s * 0.42);
    ctx.closePath();
  }

  // 장치: 별(공중) · 하트(지면). 흑백 세계에서 유일하게 컬러로 그린다. 살짝 맥동한다
  function drawItem(it) {
    if (it.kind === 'fruit') {
      drawFruit(it);
      return;
    }
    const cx = it.x + it.w / 2;
    const cy = it.y + it.h / 2;
    const pulse = 1 + 0.08 * Math.sin(clockT * 6);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    if (it.kind === 'star') {
      starPath(0, 0, 13, 5.6);
      ctx.fillStyle = STAR_COLOR;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = STAR_EDGE;
      ctx.stroke();
    } else {
      heartPath(0, 0, 28);
      ctx.fillStyle = HEART_COLOR;
      ctx.fill();
    }
    ctx.restore();
  }

  // 방패 보유: 캐릭터를 감싸는 분홍 고리. 무적 중: 주변을 도는 별 반짝임 (캐릭터 깜빡임은 drawPlayer)
  function drawAura() {
    const cx = PLAYER_X + CHAR_W / 2;
    const cy = GROUND_Y - lift - DISPLAY_H / 2;
    if (shield > 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, 54, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = HEART_COLOR;
      ctx.globalAlpha = 0.5 + 0.25 * Math.sin(clockT * 5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (invulnLeft > 0) {
      for (let i = 0; i < 4; i++) {
        const a = clockT * 3 + i * Math.PI / 2;
        starPath(cx + Math.cos(a) * 50, cy + Math.sin(a) * 42, 6, 2.5);
        ctx.fillStyle = STAR_COLOR;
        ctx.fill();
      }
    }
  }

  function drawEffects() {
    for (const e of effects) {
      ctx.globalAlpha = Math.max(0, e.life / 0.45);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - 2.5, e.y - 2.5, 5, 5);
    }
    ctx.globalAlpha = 1;
  }

  // 점수: 우상단 5자리 + 그 왼쪽 HI 최고기록. 100점마다 현재 점수가 깜빡인다.
  // HI 왼쪽에 현재 배속을 작게 표시한다 (1배·0.7배·1.4배)
  // 왼쪽 위: 모은 별 개수, 방패를 들고 있으면 옆에 하트
  function drawHud() {
    ctx.fillStyle = curInk;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'right';
    ctx.font = '700 18px ui-monospace, Menlo, Consolas, monospace';
    const hidden = blinkLeft > 0 && Math.floor(blinkLeft * 10) % 2 === 1;
    if (!hidden) ctx.fillText(pad5(score), worldW - 16, 16);
    ctx.fillText('HI ' + pad5(best), worldW - 86, 16);
    ctx.font = '700 12px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
    ctx.fillText(speedId + '배', worldW - 180, 19);

    starPath(22, 25, 9, 4);
    ctx.fillStyle = STAR_COLOR;
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = curInk;
    ctx.font = '700 18px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(String(stars), 36, 16);
    // 과일 아이콘 + 개수 (별 개수 옆)
    ctx.save();
    ctx.translate(92, 25);
    ctx.scale(0.75, 0.75);
    drawFruitShape('apple');
    ctx.restore();
    ctx.fillStyle = curInk;
    ctx.fillText(String(fruits), 106, 16);
    if (shield > 0) {
      heartPath(160, 25, 18);
      ctx.fillStyle = HEART_COLOR;
      ctx.fill();
    }
  }

  // 캐릭터: 준비 화면은 선택한 캐릭터가 서 있고, 진행 중에는 달리기 2프레임 (점프·충돌 자세 포함)
  // 무적 중에는 깜빡인다
  function drawPlayer() {
    const mode = state === 'crashed' ? 'crash' : (grounded ? 'run' : 'jump');
    const blinkOff = invulnLeft > 0 && Math.floor(clockT * 12) % 2 === 1;
    const who = selected || 'tino';
    if (nightMix > 0) drawHalo(nightMix);
    ctx.globalAlpha = blinkOff ? 0.35 : 1;
    drawCharacter(ctx, PLAYER_X, GROUND_Y - lift, who, stepFrame, mode);
    ctx.globalAlpha = 1;
    drawAura();
  }

  function draw() {
    curPaper = mixColor(PAPER, NIGHT_PAPER, nightMix);
    curInk = mixColor(INK, NIGHT_INK, nightMix);
    ctx.fillStyle = curPaper;
    ctx.fillRect(0, 0, worldW, WORLD_H);
    if (nightMix > 0) drawSky(nightMix);
    drawGround();
    for (const f of flowers) drawFlower(f);
    for (const o of obstacles) if (!o.broken) drawRock(o);
    for (const it of items) drawItem(it);
    drawCheers();
    drawPlayer();
    drawCelebs();
    drawEffects();
    drawHud();
  }

  // ===== 메인 루프 (delta time 기반) =====
  function frame(ts) {
    const dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (TEST_MODE && state === 'ready') startGame(); // 테스트는 시작 화면 없이 바로 달린다
    if (state === 'playing') scroll += speed * dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ===== 시작 =====
  applySize();
  window.addEventListener('resize', resize);
  drawPreviews();
  renderChoice();
  if (TEST_MODE) {
    // 테스트 전용: 같은 드로잉 함수를 외부에서 호출해 자세별 몸통 픽셀을 비교한다
    testResult.char = selected;
    testResult.speedMul = speedMul;
    window.__TEST_RESULT = Object.assign({}, testResult);
    badge.hidden = false;
    badge.textContent = '자동 테스트 진행 중 · ' + CHAR_NAMES[selected];
    showPanel(null);
  } else {
    showPanel('ready');
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
