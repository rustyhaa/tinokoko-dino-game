<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티노코코 동시점프 러너</title>
<style>
  html, body {
    margin: 0;
    background: #FFF8EA;
    color: #5A4636;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #stage {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 20px;
    margin: 4px 0 10px;
  }
  #wrap {
    position: relative;
    width: 100%;
  }
  #game {
    display: block;
    border-radius: 16px;
    background: #FFF6E0;
    box-shadow: 0 2px 8px rgba(90, 70, 54, 0.12);
    touch-action: none; /* 모바일에서 탭해도 페이지가 스크롤·확대되지 않게 */
    user-select: none;
    -webkit-user-select: none;
  }
  #hud {
    position: absolute;
    top: 10px;
    right: 14px;
    text-align: right;
    font-size: 16px;
    font-weight: 700;
    pointer-events: none; /* 점수판 위를 눌러도 점프가 되도록 */
  }
  #best {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.75;
  }
  #mute {
    position: absolute;
    top: 56px;
    right: 10px;
    padding: 4px 10px;
    border: 1px solid #E0CFA8;
    border-radius: 999px;
    background: rgba(255, 252, 244, 0.95);
    color: #5A4636;
    font-size: 13px;
    cursor: pointer;
  }
  #hint {
    font-size: 14px;
    margin: 10px 4px 0;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="stage">
  <h1>티노코코 동시점프 러너</h1>
  <div id="wrap">
    <canvas id="game" role="img" aria-label="티노와 코코가 달리며 장애물을 넘는 게임 화면"></canvas>
    <div id="hud">
      ⭐ 넘은 장애물 수 <b id="score">0</b>
      <div id="best"></div>
    </div>
    <button id="mute" type="button" aria-pressed="false">🔊 소리 켬</button>
  </div>
  <p id="hint">스페이스바 · ↑ · 화면 탭 = 둘이 같이 점프! 물웅덩이와 돌멩이를 넘어보세요.</p>
</div>

<script>
(function () {
  'use strict';

  // ===== 기본 설정 =====
  // 월드(논리) 높이 400. 실제 화면 높이는 360~420px 사이에서 비율에 맞춰 축소·확대된다.
  const WORLD_H = 400;
  const GROUND_Y = 320;        // 땅 기준선 (발끝이 닿는 y)
  const DISPLAY_H = 120;       // 캐릭터 표시 높이 — 티노와 코코 모두 같은 값 (쌍둥이 동일 키)
  const COCO_X = 70;           // 코코 x: 뒤쪽
  const TINO_X = 170;          // 티노 x: 살짝 앞쪽 (겹치지 않게 어긋남)

  // 점프 물리: 중력은 약하게, 점프는 높게, 착지 때 살짝 통통
  const GRAVITY = 1000;                             // 중력 (월드 px/s²)
  const JUMP_H = 140;                              // 점프 최고 높이 (월드 px)
  const JUMP_V = Math.sqrt(2 * GRAVITY * JUMP_H);  // 점프 초기 속도
  const BOUNCE_RATIO = 0.2;                        // 착지 반동 세기 (착지 속도의 20%)
  const BOUNCE_MIN_IMPACT = 80;                    // 이 속도 이상으로 떨어졌을 때만 통통 튐
  // 반동까지 포함한 공중 체류 시간(초)
  const AIR_TIME = (2 * JUMP_V + 2 * BOUNCE_RATIO * JUMP_V) / GRAVITY;

  // 속도와 장애물 간격: 느리게 시작, 아주 완만하게 가속
  const START_SPEED = 170;     // 시작 속도 (월드 px/s)
  const MAX_SPEED = 360;       // 최고 속도
  const ACCEL = 3;             // 가속도 (px/s²)
  // 최고 속도에서도 한 번의 점프로 넘을 수 있도록 장애물 사이 최소 간격을 보장
  const MIN_GAP = Math.ceil(MAX_SPEED * AIR_TIME + 60);
  const EXTRA_GAP = 180;       // 최소 간격 위에 더해지는 랜덤 여유
  const FIRST_GAP = 300;       // 첫 장애물까지 여유

  // 충돌 판정: 이미지보다 좌우·위쪽을 25%씩 안쪽으로 잡는다 (관대한 판정)
  // 발끝(아래쪽)은 안쪽으로 줄이지 않는다. 땅 장애물과 닿아야 하기 때문.
  const HIT_INSET = 0.25;

  const RESTART_LOCK_MS = 500; // 풍덩 직후 연타로 바로 재시작되는 것을 막는 짧은 대기
  const BOB_AMP = 3.5;         // 달릴 때 위아래로 흔들리는 폭(px)
  const BOB_HZ = 2.5;          // 흔들림 빈도
  const BEST_KEY = 'tinokoko-dino-best';

  const CLOUD_TILE = 820;      // 구름 반복 간격
  const HILL_TILE = 700;       // 언덕 반복 간격
  const GRASS_TILE = 600;      // 잔디 점 반복 간격

  const SPRITE_FILES = {
    tino: { run: 'assets/tino_run_v2.png', jump: 'assets/tino_jump_v2.png', laugh: 'assets/tino_laugh_v2.png' },
    coco: { run: 'assets/coco_run_v2.png', jump: 'assets/coco_jump_v2.png', laugh: 'assets/coco_laugh_v2.png' },
  };

  // 배경 장식 (고정 배치, 반복해서 흐름)
  const CLOUDS = [
    { x: 120, y: 70, s: 1.0 },
    { x: 430, y: 48, s: 0.8 },
    { x: 640, y: 92, s: 1.1 },
  ];
  const HILLS = [
    { x: 90, rx: 170, ry: 70, color: '#D7EBCF' },
    { x: 400, rx: 130, ry: 55, color: '#CFE6EA' },
    { x: 610, rx: 190, ry: 80, color: '#F4D9D2' },
  ];
  const GRASS = Array.from({ length: 36 }, () => ({
    x: Math.random() * GRASS_TILE,
    y: GROUND_Y + 14 + Math.random() * (WORLD_H - GROUND_Y - 26),
  }));

  // ===== DOM =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const muteBtn = document.getElementById('mute');

  // ===== 상태 =====
  let dpr = 1;
  let scale = 1;               // CSS px / 월드 px
  let worldW = 900;            // 현재 화면 너비에 해당하는 월드 너비
  let state = 'ready';         // 'ready' 시작 전 | 'playing' 진행 중 | 'crashed' 부딪힘
  let score = 0;
  let best = readBest();
  let speed = START_SPEED;
  let scroll = 0;              // 배경 흐름 거리
  let runClock = 0;            // 달리기 애니메이션 시간
  let obstacles = [];          // { type, x, w, h, cleared }
  let nextGap = FIRST_GAP;
  let lift = 0;                // 땅에서 떠 있는 높이 (두 캐릭터가 공유: 한 팀)
  let vy = 0;                  // 수직 속도
  let grounded = true;
  let bounced = false;         // 이번 점프에서 착지 반동을 이미 썼는지
  let crashedAt = 0;
  let lastTs = null;
  let muted = false;
  let audioCtx = null;         // 첫 사용자 입력 뒤에만 만든다

  // 이미지 6장
  const sprites = { tino: {}, coco: {} };
  let spriteError = false;

  // ===== 이미지 로딩 =====
  function loadSprites() {
    for (const who of Object.keys(SPRITE_FILES)) {
      for (const pose of Object.keys(SPRITE_FILES[who])) {
        const img = new Image();
        img.onerror = () => { spriteError = true; };
        img.src = SPRITE_FILES[who][pose];
        sprites[who][pose] = img;
      }
    }
  }

  function spritesReady() {
    return Object.values(sprites).every(group =>
      Object.values(group).every(img => img.complete && img.naturalWidth > 0));
  }

  // 표시 너비: 높이는 DISPLAY_H로 통일하고 원본 비율대로 넓이를 정한다
  function spriteWidth(img) {
    if (!img || !img.complete || !img.naturalHeight) return DISPLAY_H * 0.8;
    return DISPLAY_H * img.naturalWidth / img.naturalHeight;
  }

  // ===== 화면 크기 =====
  function resize() {
    const cssW = wrap.clientWidth;
    // 높이는 가로 비율을 따르되 360~420px 범위로 제한
    const cssH = Math.round(Math.min(420, Math.max(360, cssW * 0.42)));
    dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = cssH / WORLD_H;
    worldW = cssW / scale;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }

  // ===== 저장 (실패해도 게임은 그대로 동작) =====
  function readBest() {
    try {
      return Number(localStorage.getItem(BEST_KEY)) || 0;
    } catch (err) {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      // 저장이 안 돼도 무시
    }
  }

  // ===== 소리 (WebAudio 신스, 외부 파일 없음) =====
  function initAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (err) {
      audioCtx = null;
    }
  }

  // 주파수가 f0에서 f1로 미끄러지는 짧은 음 하나
  function tone(type, f0, f1, dur, vol) {
    if (muted || !audioCtx || audioCtx.state !== 'running') return;
    try {
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t0);
      osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (err) {
      // 소리 실패는 게임 진행에 영향 없게 무시
    }
  }

  const sfxJump = () => tone('triangle', 520, 980, 0.16, 0.25);   // 뽕
  const sfxStar = () => tone('sine', 1318, 1318, 0.35, 0.22);     // 띵
  const sfxSplash = () => tone('sine', 260, 90, 0.45, 0.35);      // 풍덩

  // ===== 물리 =====
  // 점프 중 위치와 착지 처리. 공중에서는 점프 입력을 무시하므로 이중 점프가 없다.
  function updateJump(dt) {
    if (grounded) return;
    vy -= GRAVITY * dt;
    lift += vy * dt;
    if (lift <= 0) {
      lift = 0;
      const impact = -vy;
      if (!bounced && impact > BOUNCE_MIN_IMPACT) {
        vy = impact * BOUNCE_RATIO; // 착지 반동 (한 번만)
        bounced = true;
      } else {
        vy = 0;
        grounded = true;
        bounced = false;
      }
    }
  }

  function jump() {
    if (!grounded) return;
    grounded = false;
    bounced = false;
    vy = JUMP_V;
    sfxJump();
  }

  // ===== 충돌 박스 =====
  // 팀 전체를 한 덩어리로 본다 (점프 타이밍 하나, 충돌 한 번)
  function teamBox() {
    return {
      x: COCO_X,
      y: GROUND_Y - lift - DISPLAY_H,
      w: TINO_X + spriteWidth(sprites.tino.run) - COCO_X,
      h: DISPLAY_H,
    };
  }

  function obstacleBox(o) {
    return { x: o.x, y: GROUND_Y - o.h, w: o.w, h: o.h };
  }

  // 좌우·위쪽 25% 안쪽으로 줄인 판정 박스 (발끝은 그대로)
  function hitBox(r) {
    return {
      x: r.x + r.w * HIT_INSET,
      y: r.y + r.h * HIT_INSET,
      w: r.w * (1 - 2 * HIT_INSET),
      h: r.h * (1 - HIT_INSET),
    };
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // ===== 게임 흐름 =====
  function setScore() {
    scoreEl.textContent = String(score);
  }

  function startGame() {
    state = 'playing';
    score = 0;
    setScore();
    speed = START_SPEED;
    obstacles = [];
    nextGap = FIRST_GAP;
  }

  function crash() {
    state = 'crashed';
    crashedAt = performance.now();
    if (score > best) {
      best = score;
      writeBest(best);
      bestEl.textContent = '최고 ⭐ ' + best;
    }
    sfxSplash();
  }

  function maybeSpawn() {
    const last = obstacles[obstacles.length - 1];
    const lastRight = last ? last.x + last.w : 0;
    if (worldW - lastRight < nextGap) return;
    if (Math.random() < 0.5) {
      obstacles.push({ type: 'puddle', x: worldW + 10, w: 84, h: 16, cleared: false });
    } else {
      obstacles.push({ type: 'rock', x: worldW + 10, w: 48, h: 40, cleared: false });
    }
    nextGap = MIN_GAP + Math.random() * EXTRA_GAP;
  }

  function updatePlaying(dt) {
    speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
    const d = speed * dt;
    scroll += d;
    maybeSpawn();
    for (const o of obstacles) o.x -= d;

    const team = hitBox(teamBox());
    for (const o of obstacles) {
      if (overlap(team, hitBox(obstacleBox(o)))) {
        crash();
        return;
      }
      // 팀의 왼쪽 끝을 완전히 지나간 장애물 = 넘은 것
      if (!o.cleared && o.x + o.w < COCO_X) {
        o.cleared = true;
        score += 1;
        setScore();
        sfxStar();
      }
    }
    obstacles = obstacles.filter(o => o.x + o.w > -20);
  }

  function update(dt) {
    updateJump(dt);
    if (state === 'playing') {
      updatePlaying(dt);
      runClock += dt;
    } else if (state === 'ready') {
      runClock += dt;
    }
    // crashed: 세계는 멈추고, 캐릭터는 착지까지만 updateJump로 떨어진다
  }

  // ===== 입력 =====
  function onAction() {
    if (!spritesReady()) return;
    initAudio();
    if (state === 'ready') {
      startGame();
      jump();
    } else if (state === 'playing') {
      jump();
    } else if (state === 'crashed' && performance.now() - crashedAt > RESTART_LOCK_MS) {
      startGame();
    }
  }

  function isJumpKey(e) {
    return e.code === 'Space' || e.code === 'ArrowUp';
  }

  window.addEventListener('keydown', e => {
    if (!isJumpKey(e)) return;
    e.preventDefault(); // 페이지 스크롤 방지
    if (!e.repeat) onAction(); // 누르고 있어도 한 번만
  });

  window.addEventListener('keyup', e => {
    if (isJumpKey(e)) e.preventDefault();
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    onAction();
  });

  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 소리 끔' : '🔊 소리 켬';
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.blur(); // 포커스가 남아 스페이스바가 버튼을 누르지 않도록
  });

  // ===== 그리기 =====
  function wrapX(base, offset, tile) {
    return ((base - offset) % tile + tile) % tile;
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 34 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 26 * s, y + 4 * s, 22 * s, 14 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 26 * s, y + 4 * s, 24 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    // 크림색 하늘
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#FFF8E6');
    sky.addColorStop(1, '#FFEFD1');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, worldW, GROUND_Y);

    // 구름 (느리게 흐름)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    for (const c of CLOUDS) {
      for (let x = wrapX(c.x, scroll * 0.2, CLOUD_TILE) - CLOUD_TILE; x < worldW + 200; x += CLOUD_TILE) {
        drawCloud(x, c.y, c.s);
      }
    }

    // 파스텔 언덕 (조금 더 빠르게 흐름)
    for (const h of HILLS) {
      ctx.fillStyle = h.color;
      for (let x = wrapX(h.x, scroll * 0.45, HILL_TILE) - HILL_TILE; x < worldW + 200; x += HILL_TILE) {
        ctx.beginPath();
        ctx.ellipse(x, GROUND_Y, h.rx, h.ry, 0, Math.PI, 0);
        ctx.fill();
      }
    }

    // 땅
    ctx.fillStyle = '#EFDDB0';
    ctx.fillRect(0, GROUND_Y, worldW, WORLD_H - GROUND_Y);
    ctx.strokeStyle = '#C9B38A';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(worldW, GROUND_Y);
    ctx.stroke();

    // 잔디 점 (땅과 같은 속도로 흐름)
    ctx.fillStyle = '#A9CF8E';
    for (const g of GRASS) {
      for (let x = wrapX(g.x, scroll, GRASS_TILE) - GRASS_TILE; x < worldW + 20; x += GRASS_TILE) {
        ctx.beginPath();
        ctx.ellipse(x, g.y, 4, 1.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 물웅덩이: 파란 타원
  function drawPuddle(o) {
    const cx = o.x + o.w / 2;
    const cy = GROUND_Y - o.h / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#9AD6EE';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#5AA7CF';
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx - o.w * 0.15, cy - o.h * 0.12, o.w * 0.16, o.h * 0.14, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fill();
  }

  // 돌멩이: 회색 울퉁불퉁한 도형
  function drawRock(o) {
    const x = o.x;
    const y = GROUND_Y - o.h;
    const w = o.w;
    const h = o.h;
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x + w * 0.05, y + h * 0.55);
    ctx.quadraticCurveTo(x + w * 0.2, y, x + w * 0.55, y + h * 0.02);
    ctx.quadraticCurveTo(x + w * 0.95, y + h * 0.1, x + w, y + h * 0.6);
    ctx.lineTo(x + w * 0.9, GROUND_Y);
    ctx.closePath();
    ctx.fillStyle = '#B4BAC1';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#7C848C';
    ctx.stroke();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      if (o.type === 'puddle') drawPuddle(o);
      else drawRock(o);
    }
  }

  function drawSprite(img, x, liftPx) {
    if (!img || !img.complete || !img.naturalHeight) return;
    const w = spriteWidth(img);
    ctx.drawImage(img, x, GROUND_Y - liftPx - DISPLAY_H, w, DISPLAY_H);
  }

  // 자세: 부딪힘 = 웃음, 공중 = 점프, 땅 = 달리기 (+ 위아래 흔들림)
  function drawTeam() {
    const pose = state === 'crashed' ? 'laugh' : (grounded ? 'run' : 'jump');
    let bob = 0;
    if (grounded && state !== 'crashed') {
      bob = (Math.sin(runClock * Math.PI * 2 * BOB_HZ) + 1) / 2 * BOB_AMP;
    }
    // 코코를 먼저 그려서 티노가 앞에 보이게 한다
    drawSprite(sprites.coco[pose], COCO_X, lift + bob);
    drawSprite(sprites.tino[pose], TINO_X, lift + bob);
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 안내 문구 패널 (화면 가운데 위)
  function drawPanel(lines, top) {
    const cx = worldW / 2;
    const lineH = 34;
    const panelW = 420;
    const panelH = lines.length * lineH + 18;
    roundRectPath(cx - panelW / 2, top, panelW, panelH, 14);
    ctx.fillStyle = 'rgba(255, 250, 240, 0.94)';
    ctx.fill();
    ctx.strokeStyle = '#E8D6B0';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#5A4636';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((text, i) => {
      ctx.font = i === 0
        ? '700 24px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif'
        : '400 16px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillText(text, cx, top + 18 + lineH * i + lineH / 2 - 8);
    });
  }

  function drawMessage() {
    if (state === 'ready') {
      drawPanel(['스페이스바 · 화면 탭으로 출발!'], 120);
    } else if (state === 'crashed') {
      drawPanel(['풍덩! 다시 해볼까?', '스페이스바 · 화면 탭으로 다시 시작'], 120);
    }
  }

  function drawStatus() {
    ctx.fillStyle = '#5A4636';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '400 18px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(
      spriteError ? '이미지를 불러오지 못했어요 (assets 폴더를 확인해 주세요)' : '불러오는 중…',
      worldW / 2,
      WORLD_H / 2
    );
  }

  function draw() {
    ctx.clearRect(0, 0, worldW, WORLD_H);
    drawBackground();
    if (!spritesReady()) {
      drawStatus();
      return;
    }
    drawObstacles();
    drawTeam();
    drawMessage();
  }

  // ===== 메인 루프 (delta time 기반) =====
  function frame(ts) {
    const dt = lastTs === null ? 0 : Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (spritesReady()) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ===== 시작 =====
  loadSprites();
  resize();
  window.addEventListener('resize', resize);
  setScore();
  bestEl.textContent = '최고 ⭐ ' + best;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
