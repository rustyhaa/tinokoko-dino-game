<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>티노코코 무지개 방울</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8fd4ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무지개 방울">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  /* 부모용 최소 UI: 소리 켜고 끄기 */
  #tools{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
    display:flex;gap:8px;align-items:center;z-index:2}
  #snd,#gear{
    width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.8);
    padding:8px;opacity:.6;cursor:pointer}
  #snd svg,#gear svg{width:100%;height:100%;display:block}
  #snd .x{display:none}
  #snd.off .x{display:inline}
  #snd.off .w{display:none}
  /* 부모용 최소 UI: 잘 시간 타이머 (끔 → 5분 → 10분 → 15분) */
  #zz{
    height:44px;min-width:44px;border-radius:22px;border:0;background:rgba(255,255,255,.8);
    padding:0 10px 0 8px;opacity:.6;cursor:pointer;display:flex;align-items:center;gap:4px;
    font:600 12px/1 system-ui,sans-serif;color:#335}
  #zz svg{width:20px;height:20px;display:block}
  #zz.on{opacity:.85}
  #gear.on{opacity:.95}
  /* 부모 설정 패널 (어른용이라 글자 사용) */
  #panel{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:max(10px,env(safe-area-inset-right));
    z-index:2;background:rgba(255,255,255,.95);border-radius:14px;padding:10px 12px;display:grid;gap:8px;
    box-shadow:0 4px 18px rgba(30,60,90,.18);font:600 13px/1.2 system-ui,sans-serif;color:#335}
  #panel[hidden]{display:none}
  #panel .row{display:grid;grid-template-columns:5.5em 1fr 1fr;gap:6px;align-items:center}
  #panel button{min-height:36px;border-radius:10px;border:1.5px solid #b9d3e6;background:#fff;color:#335;
    font:inherit;padding:0 10px;cursor:pointer}
  #panel button.sel{background:#3d7fb8;border-color:#3d7fb8;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tools">
<button id="gear" aria-label="부모 설정"><svg viewBox="0 0 24 24" fill="none" stroke="#335" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke-linecap="round"/></svg></button>
<button id="zz" aria-label="잘 시간 타이머 (부모용)"><svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5z" fill="#335"/></svg><span id="zzl">끔</span></button>
<button id="snd" aria-label="소리 켜기/끄기">
  <svg viewBox="0 0 24 24" fill="none" stroke="#335" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="#335"/>
    <path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>
    <path class="x" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
</div>
<div id="panel" hidden>
  <div class="row"><span>터뜨릴 때</span><button data-k="voice" data-v="song">동요</button><button data-k="voice" data-v="color">색 이름</button></div>
  <div class="row"><span>방울 크기</span><button data-k="size" data-v="1">보통</button><button data-k="size" data-v="1.3">크게</button></div>
  <div class="row"><span>방울 속도</span><button data-k="speed" data-v="1">보통</button><button data-k="speed" data-v="0.6">느리게</button></div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 빨주노초파남보
const COLS = [[255,90,95],[255,159,67],[255,214,50],[76,210,100],[58,167,255],[100,100,225],[176,92,240]];
const FREQ = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33]; // 펜타토닉 계열 — 어떤 순서로 눌러도 어울림
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// 부모 설정 (이 기기 브라우저에만 저장, 실패해도 기본값으로 동작)
const settings = { voice: 'song', size: 1, speed: 1 };
try { Object.assign(settings, JSON.parse(localStorage.getItem('tk-rainbow-settings') || '{}')); } catch (e) {}
let W, H, S, R, gy, U;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W * 0.155, H * 0.15);            // 캐릭터 크기 단위 (둘이 똑같이 사용)
  R = clamp(Math.min(W, H) * 0.085, 36, 72) * settings.size;   // 방울 반지름 — 아이 손가락 크기 이상 (설정: 크게 1.3배)
  gy = H * 0.87;                                // 발 딛는 선
  U = Math.min(W, H) / 700;
  twins[0].cx = Math.max(1.45 * S + 6, W * 0.17);
  twins[1].cx = W - twins[0].cx;
}

// ---------- 상태 ----------
const twins = [
  { kind: 'tino', cx: 0, hopT: -1, mouth: 0, open: 0, blink: 2, ph: 0 },
  { kind: 'coco', cx: 0, hopT: -1, mouth: 0, open: 0, blink: 3.3, ph: 1.7 },
];
let T = 0, bubbles = [], parts = [], spawnCD = 0, side = 0;
let flags = Array(7).fill(false), lit = Array(7).fill(0), litPulse = Array(7).fill(0);
let party = 0, partyHop = 0, hint = true, pops = 0, parties = 0;
// 판마다 배경: 낮 → 노을 → 밤 (해금·수집 없이 변화만)
let theme = 0, prevTheme = 0, themeBlend = 1;
// 잘 시간: 부모가 정한 시간이 지나면 둘이 하품하고 잠듦
const SLEEP_MIN = [0, 5, 10, 15];
let sleepIdx = 0, sleepAt = null, sleep = 0, zzzCD = 0;
const nightStars = Array.from({ length: 46 }, () => ({ x: Math.random(), y: Math.random() * 0.55, s: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.3 }));
const clouds = [0, 1, 2].map(i => ({ x: Math.random(), y: 0.08 + i * 0.09, s: 0.8 + Math.random() * 0.6, v: 0.006 + Math.random() * 0.006 }));

// ---------- 소리 (WebAudio 합성) ----------
let ac = null, master = null, muted = false;
function audio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    ac = new C();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, delay = 0, dur = 0.35, type = 'sine', vol = 0.3, f2 = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur = 0.1, f = 2000, vol = 0.2, delay = 0, f2 = 0) {
  if (!ac) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime + delay;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
  bp.frequency.setValueAtTime(f, t);
  if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
// 동요 '반짝반짝 작은 별': 어떤 색을 터뜨리든 다음 음이 이어서 나옴. 6초 쉬면 처음부터
const NOTE = { C: 261.63, D: 293.66, E: 329.63, F: 349.23, G: 392.0, A: 440.0 };
const SONG = 'CCGGAAG FFEEDDC GGFFEED GGFFEED CCGGAAG FFEEDDC'.replace(/ /g, '').split('').map(n => NOTE[n]);
let songIdx = 0, lastPopT = -99;
function nextNote() {
  if (T - lastPopT > 6) songIdx = 0;
  lastPopT = T;
  const f = SONG[songIdx]; songIdx = (songIdx + 1) % SONG.length;
  return f;
}
// 색 이름 말하기 (브라우저 음성). 빨리 여러 개 터지면 마지막 것만 말함
const COLOR_NAMES = ['빨강', '주황', '노랑', '초록', '파랑', '남색', '보라'];
function sayColor(c) {
  try {
    const ss = window.speechSynthesis;
    if (!ss || muted) return;
    ss.cancel();
    const u = new SpeechSynthesisUtterance(COLOR_NAMES[c]);
    u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.35; u.volume = 1;
    const v = ss.getVoices().find(v => /^ko/i.test(v.lang));
    if (v) u.voice = v;
    ss.speak(u);
  } catch (e) {}
}
const sPopColor = c => { noise(0.05, 2600, 0.22); tone(FREQ[c], 0, 0.25, 'sine', 0.22); sayColor(c); };
// 둘이 함께: 짝짝 + 화음
function sHighFive() {
  noise(0.06, 3000, 0.35); noise(0.06, 3000, 0.35, 0.16);
  [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, 0.2, 0.9, 'triangle', 0.14));
}
const sSplash = () => noise(0.25, 1200, 0.1, 0, 400);
const sPop = () => { noise(0.05, 2600, 0.25); const f = nextNote(); tone(f, 0, 0.55, 'sine', 0.34); tone(f * 2, 0, 0.18, 'triangle', 0.1); };
// 캐릭터를 누르면 '히히히' (티노가 조금 낮고 코코가 조금 높음)
function sGiggle(kind) {
  const base = kind === 'tino' ? 500 : 640;
  for (let i = 0; i < 4; i++) tone(base * (1.1 - i * 0.07), i * 0.09, 0.08, 'triangle', 0.2, base * (1.3 - i * 0.07));
}
function sSparkle() {
  noise(0.4, 6000, 0.08);
  [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => tone(f, i * 0.06, 0.3, 'sine', 0.12));
}
const sSoft = () => tone(rand(900, 1300), 0, 0.3, 'sine', 0.05);
function sYawn() { tone(520, 0, 1.1, 'sine', 0.14, 230); tone(660, 0.7, 1.1, 'sine', 0.12, 280); }
function sLullaby() { SONG.slice(0, 14).forEach((f, i) => tone(f, 1.6 + i * 0.5, 0.6, 'sine', 0.09)); }
const sStomp = () => tone(150, 0.05, 0.25, 'sine', 0.45, 50);
const sSpout = () => noise(0.5, 900, 0.18, 0.05, 3500);
const sBlow = () => tone(rand(500, 700), 0, 0.12, 'sine', 0.05, 900);
const sTap = () => tone(FREQ[(Math.random() * 7) | 0] / 2, 0, 0.25, 'triangle', 0.1);
function sFanfare() {
  [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) => {
    tone(f, i * 0.13, 0.45, 'triangle', 0.22); tone(f / 2, i * 0.13, 0.3, 'sine', 0.12);
  });
  for (let i = 0; i < 8; i++) tone(rand(1500, 2600), 1 + i * 0.09, 0.2, 'sine', 0.05);
}

// ---------- 방울 ----------
function pickColor() {
  const need = [];
  flags.forEach((f, i) => { if (!f) need.push(i); });
  if (need.length && Math.random() < 0.65) return need[(Math.random() * need.length) | 0];
  return (Math.random() * 7) | 0;
}
function mouthPos(tw) {
  const dir = tw.kind === 'tino' ? 1 : -1;
  return { x: tw.cx + dir * 1.05 * S, y: gy - 1.2 * S, dir };
}
function spawn() {
  const tw = twins[side]; side ^= 1;
  const m = mouthPos(tw);
  tw.mouth = 0.45;
  // 가끔(약 8%) 큰 금빛 별 방울 — 터뜨리면 작은 방울이 우르르. 놓쳐도 아무 일 없음
  const star = party <= 0 && pops >= 3 && !bubbles.some(x => x.star) && Math.random() < 0.08;
  bubbles.push({ x: m.x, y: m.y, dir: m.dir, vy: -rand(45, 75) * H / 700, r: R * (star ? 1.3 : rand(0.9, 1.12)),
                 c: star ? 2 : pickColor(), star, ph: rand(0, TAU), age: 0, grow: 0.15 });
  sBlow();
}
function seedBubbles() {
  for (let i = 0; i < 4; i++) {
    bubbles.push({ x: W * (0.3 + 0.4 * i / 3) + rand(-20, 20), y: H * rand(0.2, 0.5), dir: 0,
                   vy: -rand(40, 65) * H / 700, r: R * rand(0.95, 1.1), c: pickColor(), ph: rand(0, TAU), age: 3, grow: 1 });
  }
}

// ---------- 터뜨리기 ----------
function hop(tw) { if (tw.hopT < 0 || tw.hopT > 0.3) tw.hopT = 0; tw.mouth = 0.5; }
const lastPopBy = new Map();   // 누가(어느 손가락·키보드) 마지막으로 터뜨렸나
let lastTogether = -99;
function pop(b, src) {
  bubbles.splice(bubbles.indexOf(b), 1);
  pops++; hint = false;
  const col = b.star ? [255, 200, 40] : COLS[b.c];
  if (b.star) sSparkle(); else if (settings.voice === 'color') sPopColor(b.c); else sPop();
  // 둘이 함께: 동시에 화면에 닿아 있는 두 손가락이(또는 터치+키보드·마우스처럼 다른 입력이) 0.5초 안에 각각 터뜨리면 하이파이브.
  // 한 아이가 같은 손으로 빠르게 두 번 탭하는 건 해당 안 됨 (탭마다 번호가 바뀌어도 '동시에 닿아 있음' 조건에서 걸러짐)
  if (src !== undefined && sleep <= 0) {
    const kind = k => k.replace(/\d+$/, '');
    for (const [k, t] of lastPopBy) {
      const concurrent = kind(k) !== kind(src) || active.has(k);
      if (k !== src && concurrent && T - t < 0.5 && T - lastTogether > 2) { together(); break; }
    }
    lastPopBy.set(src, T);
  }
  if (!b.star && sleep <= 0 && Math.random() < 0.22) addFriend(b.x, b.y);
  parts.push({ t: 'ring', x: b.x, y: b.y, r: b.r, life: 0.4, max: 0.4, c: col });
  for (let i = 0; i < 12; i++) {
    const a = rand(0, TAU), v = rand(120, 320) * U;
    parts.push({ t: 'drop', x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80 * U,
                 r: rand(4, 9) * U, life: rand(0.5, 0.9), max: 0.9, c: col });
  }
  if (b.star) { starBurst(b); return; }
  if (party <= 0 && sleep <= 0 && !flags[b.c]) {
    flags[b.c] = true; litPulse[b.c] = 1;
    if (flags.every(Boolean)) setTimeout(startParty, 350);
  }
  // 가까운 쪽 쌍둥이가 반응
  const tw = Math.abs(b.x - twins[0].cx) <= Math.abs(b.x - twins[1].cx) ? twins[0] : twins[1];
  react(tw);
}
function together() {
  lastTogether = T;
  sHighFive();
  twins.forEach(tw => { hop(tw); tw.lean = 0.9; });
  const mx = W / 2, my = gy - 1.9 * S;
  for (let k = 0; k < 7; k++) parts.push({ t: 'ring', x: mx, y: my, r: (20 + k * 9) * U, life: 0.7 + k * 0.05, max: 0.9, c: COLS[k] });
  for (let i = 0; i < 26; i++) {
    const a = rand(0, TAU), v = rand(150, 380) * U;
    parts.push({ t: 'spark', x: mx, y: my, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(9, 16) * U, life: 1.1, max: 1.1,
                 c: COLS[i % 7], rot: rand(0, TAU), vr: rand(-6, 6) });
  }
}
// ---------- 방울 속 바다 친구 (가끔 튀어나와 바다로 퐁당, 게는 모래로 총총) ----------
const FRIEND_KINDS = ['fish', 'crab', 'star', 'jelly'];
let friends = [];
function addFriend(x, y) {
  const kind = FRIEND_KINDS[(Math.random() * FRIEND_KINDS.length) | 0];
  friends.push({ kind, x, y, vx: rand(-70, 70) * U, vy: -rand(60, 120) * U, age: 0, ph: rand(0, TAU),
                 land: kind === 'crab' ? H * rand(0.8, 0.93) : 0 });
}
function updateFriends(dt) {
  for (let i = friends.length - 1; i >= 0; i--) {
    const f = friends[i];
    f.age += dt;
    if (f.kind === 'crab' && f.vy === 0) {               // 모래 위를 옆걸음
      f.x += f.vx * dt;
      if (f.x < -60 || f.x > W + 60) friends.splice(i, 1);
      continue;
    }
    f.vy = Math.min(f.vy + 160 * U * dt, 110 * U);
    f.x += (f.vx + Math.sin(f.age * 3 + f.ph) * 30 * U) * dt;
    f.y += f.vy * dt;
    if (f.kind === 'crab' && f.y >= f.land) { f.y = f.land; f.vy = 0; f.vx = (f.x < W / 2 ? -1 : 1) * 110 * U; continue; }
    if (f.kind !== 'crab' && f.age > 0.4 && f.y > H * 0.63) {   // 바다에 퐁당
      sSplash();
      parts.push({ t: 'ring', x: f.x, y: f.y, r: 10 * U, life: 0.5, max: 0.5, c: [255, 255, 255] });
      for (let k = 0; k < 7; k++) parts.push({ t: 'drop', x: f.x, y: f.y, vx: rand(-60, 60) * U, vy: -rand(120, 220) * U,
                                               r: rand(3, 6) * U, life: 0.6, max: 0.6, c: [170, 225, 255] });
      friends.splice(i, 1);
    } else if (f.age > 9) friends.splice(i, 1);
  }
}
function drawFriend(f) {
  const s = R * 0.42 / settings.size, dir = f.vx >= 0 ? 1 : -1;
  ctx.save(); ctx.translate(f.x, f.y);
  if (f.kind === 'fish') {
    ctx.scale(dir, 1); ctx.rotate(Math.sin(f.age * 8) * 0.12);
    ctx.beginPath(); ctx.moveTo(-s * 0.8, 0); ctx.lineTo(-s * 1.4, -s * 0.5); ctx.lineTo(-s * 1.4, s * 0.5); ctx.closePath();
    ctx.fillStyle = '#ff8c42'; ctx.fill();
    ell(0, 0, s, s * 0.62); ctx.fillStyle = '#ffa552'; ctx.fill();
    ell(s * 0.45, -s * 0.12, s * 0.16, s * 0.16); ctx.fillStyle = '#fff'; ctx.fill();
    ell(s * 0.5, -s * 0.12, s * 0.08, s * 0.08); ctx.fillStyle = '#222'; ctx.fill();
  } else if (f.kind === 'crab') {
    const step = f.vy === 0 ? Math.sin(f.age * 18) * 0.15 : 0;
    ctx.strokeStyle = '#d9483b'; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round';
    for (const sd of [-1, 1]) for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(sd * s * 0.5, s * 0.1 + k * s * 0.15);
      ctx.lineTo(sd * s * 1.05, s * (0.45 + k * 0.15 + (k % 2 ? step : -step))); ctx.stroke();
    }

function update(dt) {
  T += dt;
  clouds.forEach(c => { c.x += c.v * dt; if (c.x > 1.2) c.x = -0.2; });

  if (sleepAt !== null && sleep <= 0 && party <= 0 && T >= sleepAt) startSleep();
  if (sleep > 0) {
    sleep += dt; zzzCD -= dt;
    if (zzzCD <= 0) {
      zzzCD = 1.4;
      twins.forEach((tw, i) => parts.push({ t: 'zzz', x: tw.cx + (i ? -0.3 : 0.3) * S, y: gy - 2.3 * S, vx: (i ? -14 : 14) * U,
                                             vy: -28 * U, r: 16 * U, life: 3, max: 3, c: [255, 255, 255], delay: i * 0.5 }));
    }
  }
  themeBlend = Math.min(1, themeBlend + dt / 2.5);
  updateFriends(dt);

  spawnCD -= dt;
  if (sleep <= 0 && spawnCD <= 0 && bubbles.length < 6) { spawn(); spawnCD = 0.9; }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.age += dt;
    b.grow = Math.min(1, 0.15 + b.age * 1.6);
    b.x += (b.dir * 110 * Math.exp(-b.age * 0.9) + Math.sin(b.age * 1.1 + b.ph) * 18) * U * dt * settings.speed;
    b.y += b.vy * dt * (b.age < 0.4 ? 0.3 : 1) * settings.speed;
    b.x = clamp(b.x, b.r * 0.7, W - b.r * 0.7);
    if (b.y < -b.r * 2) bubbles.splice(i, 1);   // 놓쳐도 그냥 날아갈 뿐
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.delay > 0) { p.delay -= dt; continue; }
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.t === 'heart' || p.t === 'spark' || p.t === 'zzz') {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98;
      if (p.t === 'spark') { p.vy *= 0.96; p.rot += p.vr * dt; }
    }
    if (p.t === 'drop' || p.t === 'conf' || p.t === 'puff') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t === 'drop') p.vy += 700 * U * dt;
      if (p.t === 'conf') { p.vy = Math.min(p.vy + 200 * U * dt, 160 * U); p.rot += p.vr * dt; p.vx += Math.sin(T * 3 + p.ph) * 30 * dt; }
    }

  twins.forEach(tw => {
    if (tw.hopT >= 0) { tw.hopT += dt; if (tw.hopT > 0.5) tw.hopT = -1; }
    tw.mouth -= dt;
    tw.open += ((tw.mouth > 0 ? 1 : 0) - tw.open) * Math.min(1, dt * 14);
    tw.blink -= dt; if (tw.blink < -0.12) tw.blink = rand(2.5, 5);
    tw.giggle = Math.max(0, (tw.giggle || 0) - dt);
    tw.lean = Math.max(0, (tw.lean || 0) - dt);
  });

  for (let i = 0; i < 7; i++) {
    lit[i] += ((flags[i] ? 1 : 0) - lit[i]) * Math.min(1, dt * (flags[i] ? 5 : 2.5));
    litPulse[i] = Math.max(0, litPulse[i] - dt * 1.5);
  }

  if (party > 0) {
    party -= dt; partyHop -= dt;
    if (partyHop <= 0) { partyHop = 0.6; twins.forEach(hop); }
    if (Math.random() < dt * 40) {
      parts.push({ t: 'conf', x: rand(0, W), y: -10, vx: rand(-30, 30) * U, vy: rand(60, 140) * U, w: rand(8, 14) * U,
                   rot: rand(0, TAU), vr: rand(-6, 6), ph: rand(0, TAU), life: 4, max: 4, c: COLS[(Math.random() * 7) | 0] });
    }

      flags = Array(7).fill(false);

}

function drawRainbow() {
  const cx = W / 2, cy = H * 0.6, Rr = Math.min(W * 0.42, H * 0.36), w = Rr * 0.08;

  for (let i = 0; i < 7; i++) {

//   tino_sleep.png, coco_sleep.png — 잘 시간
const OPTIONAL = ['tino_laugh_v3', 'tino_sleep', 'coco_sleep'];
OPTIONAL.forEach(n => { const im = new Image(); im.onerror = () => { im.bad = true; }; im.src = 'assets/' + n + '.png'; SPR[n] = im; });
const ready = n => { const im = SPR[n]; return im && !im.bad && im.complete && im.naturalWidth > 0; };
// 자세 고르기: 평소 / 반응(방울 터짐) / 축하(무지개 완성)
function poseOf(tw) {
  if (sleep > 0 && ready(tw.kind + '_sleep')) return tw.kind + '_sleep';
  if (tw.kind === 'tino') {
    if ((tw.giggle > 0 || party > 0) && ready('tino_laugh_v3')) return 'tino_laugh_v3';
    return (party > 0 || tw.hopT >= 0 || tw.giggle > 0) ? 'tino_jump_v2' : 'tino_run_v2';
  }
  if (party > 0 || tw.giggle > 0) return 'coco_laugh_v2';
  return tw.hopT >= 0 ? 'coco_jump_v2' : 'coco_run_v2';
}
function drawTwin(tw) {
  const name = poseOf(tw), im = SPR[name];
  // 통통 튀기: 반응 때는 크게 한 번 뛰고, 평소에는 제자리에서 작게 콩콩
  let lift, sx, sy, tilt = 0;
  if (sleep > 0) {            // 잘 때: 콩콩 멈추고 천천히 숨쉬며 꾸벅
    lift = 0; sx = 1; sy = 1 + 0.015 * Math.sin(T * 1.3 + tw.ph);
    tilt = Math.min(1, sleep / 2.5) * 0.12 * Math.sin(T * 0.8 + tw.ph) + Math.min(1, sleep / 2.5) * (tw.kind === 'tino' ? 0.1 : -0.1);
  } else if (tw.hopT >= 0) {
    const p = tw.hopT / 0.5;
    lift = Math.sin(Math.PI * p) * 0.55 * S;
    const edge = p < 0.12 || p > 0.88;
    sx = edge ? 1.08 : 0.95; sy = edge ? 0.9 : 1.06;      // 도약·착지 때 납작, 공중에서 길쭉
  } else {
    const b = Math.abs(Math.sin(T * (party > 0 ? 6 : 3.2) + tw.ph));
    lift = b * (party > 0 ? 0.18 : 0.07) * S;
    sy = 0.95 + 0.08 * b; sx = 1.04 - 0.06 * b;
  }
  if (tw.lean > 0) tilt += (tw.kind === 'tino' ? 0.25 : -0.25) * Math.sin(Math.PI * tw.lean / 0.9);   // 하이파이브: 서로 쪽으로 기울기
  if (sleep > 0 && name.endsWith('_sleep')) tilt = 0;
  // 그림자 (티노는 모래 위)
  if (tw.kind === 'tino') {
    ell(tw.cx, gy, S * (0.85 - lift / S * 0.35), S * 0.13);
    ctx.fillStyle = 'rgba(160,120,40,.22)'; ctx.fill();
  }
  if (!im || !im.complete || !im.naturalWidth) return;
  const h = 2.35 * S, w = h * im.naturalWidth / im.naturalHeight;
  // tino_run 은 원본이 왼쪽을 봄 → 화면에서만 뒤집어 코코 쪽(오른쪽)을 보게
  const flip = name === 'tino_run_v2' ? -1 : 1;
  ctx.save();
  ctx.translate(tw.cx, gy - lift);
  ctx.rotate(tilt);
  ctx.scale(sx * flip, sy);
  ctx.drawImage(im, -w / 2, -h, w, h);
  ctx.restore();
}

function drawPoolBack(cx) {
  ell(cx, gy + 0.04 * S, 1.55 * S, 0.42 * S); ctx.fillStyle = '#e8c98a'; ctx.fill();
  ell(cx, gy + 0.04 * S, 1.45 * S, 0.36 * S); ctx.fillStyle = '#69c3f0'; ctx.fill();
}
function drawPoolFront(cx) {
  ctx.save();
  ell(cx, gy + 0.04 * S, 1.45 * S, 0.36 * S); ctx.clip();
  ctx.fillStyle = 'rgba(105,195,240,.96)';
  ctx.beginPath(); ctx.moveTo(cx - 1.6 * S, gy - 0.22 * S);
  for (let x = -1.6; x <= 1.6; x += 0.1) ctx.lineTo(cx + x * S, gy - 0.22 * S + Math.sin(x * 5 + T * 3) * 0.03 * S);
  ctx.lineTo(cx + 1.6 * S, gy + S); ctx.lineTo(cx - 1.6 * S, gy + S); ctx.fill();
  ctx.restore();
  // 잔물결
  for (let k = 0; k < 2; k++) {
    const p = (T * 0.5 + k * 0.5) % 1;
    ell(cx, gy - 0.05 * S, (0.7 + p * 0.7) * S, (0.12 + p * 0.15) * S);
    ctx.strokeStyle = `rgba(255,255,255,${0.6 * (1 - p)})`; ctx.lineWidth = 2; ctx.stroke();
  }
}

// ---------- 그리기: 방울 · 효과 ----------
function drawBubble(b) {
  const r = b.r * b.grow * (1 + 0.035 * Math.sin(b.age * 4 + b.ph));
  const c = b.star ? [255, 196, 30] : COLS[b.c];
  ctx.save(); ctx.translate(b.x, b.y);
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,.85)');
  g.addColorStop(0.4, rgba(c, 0.5));
  g.addColorStop(1, rgba(c, 0.9));
  ell(0, 0, r, r); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.06); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, -2.6, -1.9); ctx.lineWidth = r * 0.1; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
  ell(r * 0.42, r * 0.42, r * 0.08, r * 0.08); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
  if (b.star) {
    ctx.shadowColor = 'rgba(255,230,120,.95)'; ctx.shadowBlur = 18 + 8 * Math.sin(T * 6);
    star(0, 0, r * 0.55, '#fff3b0', Math.sin(T * 2) * 0.4);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}
function heart(x, y, r, col) {
  ctx.beginPath();
  ctx.moveTo(x, y + r * 0.9);
  ctx.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.7, y - r * 1.2, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
  ctx.fillStyle = col; ctx.fill();
}
function drawParts() {
  parts.forEach(p => {
    if (p.delay > 0) return;
    const a = clamp(p.life / p.max, 0, 1);
    if (p.t === 'ring') {
      const k = 1 - a;
      ell(p.x, p.y, p.r * (1 + k * 0.8), p.r * (1 + k * 0.8));
      ctx.strokeStyle = rgba(p.c, a); ctx.lineWidth = 6 * a + 1; ctx.stroke();
    } else if (p.t === 'drop' || p.t === 'puff') {
      ell(p.x, p.y, p.r * (p.t === 'puff' ? 2 - a : 1), p.r * (p.t === 'puff' ? 2 - a : 1));
      ctx.fillStyle = rgba(p.c, p.t === 'puff' ? a * 0.6 : a); ctx.fill();
    } else if (p.t === 'heart') {
      heart(p.x, p.y, p.r * (1 + (1 - a) * 0.3), rgba(p.c, Math.min(1, a * 1.6)));
    } else if (p.t === 'spark') {
      star(p.x, p.y, p.r * (0.6 + a * 0.4), rgba(p.c, Math.min(1, a * 1.5)), p.rot);
    } else if (p.t === 'zzz') {
      const k = 1 - a;
      ctx.save(); ctx.font = `700 ${Math.round(p.r * (1 + k * 1.2))}px system-ui, sans-serif`;
      ctx.fillStyle = `rgba(255,255,255,${Math.min(1, a * 1.5) * 0.9})`; ctx.textAlign = 'center';
      ctx.fillText('z', p.x, p.y); ctx.restore();
    } else if (p.t === 'conf') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgba(p.c, Math.min(1, a * 2)); ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
      ctx.restore();
    }
  });
}
// 처음에만 나오는 힌트: 방울 둘레로 퍼지는 빛 고리 + 반짝이는 별 (글자 대신)
function drawHint() {
  if (!hint) return;
  let tgt = null;
  bubbles.forEach(b => { if (b.grow >= 1 && b.y > H * 0.15 && b.y < H * 0.6 && (!tgt || b.y > tgt.y)) tgt = b; });
  if (!tgt) return;
  ctx.save();
  for (let k = 0; k < 3; k++) {
    const p = (T * 0.8 + k / 3) % 1;
    ell(tgt.x, tgt.y, tgt.r * (1.05 + p * 0.75), tgt.r * (1.05 + p * 0.75));
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * (1 - p)})`; ctx.lineWidth = (6 * (1 - p) + 1) * U; ctx.stroke();
  }
  const tw = 1 + 0.3 * Math.sin(T * 6);
  ctx.shadowColor = 'rgba(255,220,80,.9)'; ctx.shadowBlur = 12;
  star(tgt.x + tgt.r * 0.8, tgt.y - tgt.r * 0.8, 16 * U * tw, '#ffe066', T * 1.5);
  star(tgt.x - tgt.r * 0.85, tgt.y + tgt.r * 0.55, 9 * U * (2.3 - tw), '#ffffff', -T);
  ctx.restore();
}
// 마우스 커서 대신 크게 보이는 반짝 동그라미 (아이 눈에 잘 띄게)
function drawCursor() {
  if (!mouse) return;
  const r = 14 * U + 6;
  ctx.save();
  ell(mouse.x, mouse.y, r, r);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.stroke();
  star(mouse.x, mouse.y, r * 0.55, '#ffd84a', T * 2);
  ctx.restore();
}

function draw() {
  if (themeBlend < 1) {     // 판이 바뀔 때 배경이 천천히 넘어감
    drawBg(THEMES[prevTheme]);
    ctx.globalAlpha = themeBlend; drawBg(THEMES[theme]); ctx.globalAlpha = 1;
  } else drawBg(THEMES[theme]);
  drawRainbow();
  // 티노 (모래 위)
  drawTwin(twins[0]);
  // 코코 (모래 웅덩이 속)
  drawPoolBack(twins[1].cx);
  drawTwin(twins[1]);
  drawPoolFront(twins[1].cx);
  friends.forEach(drawFriend);
  bubbles.forEach(drawBubble);
  if (sleep > 0) {          // 잘 시간: 화면이 밤처럼 어두워지고 z 가 피어오름
    ctx.fillStyle = `rgba(16,20,52,${0.55 * Math.min(1, sleep / 3)})`; ctx.fillRect(0, 0, W, H);
  }
  drawParts();
  drawHint();
  drawCursor();
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
// 홈 화면 앱: 한 번 열면 인터넷 없이도 실행되게 (파일로 열 때는 건너뜀)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
resize();
seedBubbles();
requestAnimationFrame(frame);

// 자동 확인용 (게임 동작에는 영향 없음)
window.__tk = { get bubbles() { return bubbles; }, get flags() { return flags; }, get party() { return party; },
                get pops() { return pops; }, get parties() { return parties; }, get audio() { return ac ? ac.state : 'none'; },
                get theme() { return THEMES[theme].name; }, get sleep() { return sleep; }, get songIdx() { return songIdx; },
                get active() { return active.size; }, get twins() { return twins; }, get S() { return S; }, get gy() { return gy; },
                get friends() { return friends; }, get R() { return R; }, get settings() { return settings; }, get lastTogether() { return lastTogether; },
                together, addFriend,
                sleepNow() { sleepAt = T; }, starNow() { const b = bubbles.find(x => x.grow >= 1 && x.y > 40); if (b) { b.star = true; b.c = 2; } return b && { x: b.x, y: b.y }; } };
})();
</script>
