<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#000}</style></head><body><script type="module">
import { THREE, setup, sprite, label, round, done } from './common.js';
const { r, scene, cam } = setup('#9fdcff', '#eefaff');
cam.position.set(0, 5.2, 10.5); cam.lookAt(0, 1.3, 0);
new THREE.TextureLoader().load('shared/pics/bg_pk_forest.webp', t => { t.colorSpace = THREE.SRGBColorSpace; const bg = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), new THREE.MeshBasicMaterial({ map: t })); bg.position.set(0, 7, -9); scene.add(bg); });
const grass = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshStandardMaterial({ color: 0x8fcf6a, roughness: 1 })); grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
// 울타리
for (let i = -7; i <= 7; i++) { const p = round(0.35, 1.3, 0.12, 0.08, 0xf3e3c3); p.position.set(i * 0.9, 0.65, -3.2); scene.add(p); }
const rail = new THREE.Mesh(new THREE.BoxGeometry(13.5, 0.15, 0.08), new THREE.MeshStandardMaterial({ color: 0xe9d6b0 })); rail.position.set(0, 0.95, -3.15); rail.castShadow = true; scene.add(rail);
const soil = new THREE.MeshStandardMaterial({ color: 0x7a4f2e, roughness: 1 }), green = new THREE.MeshStandardMaterial({ color: 0x55b84c, roughness: 0.7 });
const leaf = (x, y, z, s, rz, ry = 0) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), green); m.scale.set(s * 0.45, s * 1.0, s * 0.15); m.position.set(x, y, z); m.rotation.set(0, ry, rz); m.castShadow = true; scene.add(m); };
const xs = [-3.6, -1.2, 1.2, 3.6];
xs.forEach(x => { const m = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), soil); m.scale.set(1, 0.35, 0.8); m.position.set(x, 0, 0); m.castShadow = m.receiveShadow = true; scene.add(m); });
// 1) 새싹 + 비구름
leaf(xs[0] - 0.12, 0.5, 0, 0.7, 0.6); leaf(xs[0] + 0.12, 0.5, 0, 0.7, -0.6);
const cloud = new THREE.Group(); [[0, 0, 0.55], [0.55, -0.1, 0.42], [-0.55, -0.1, 0.42], [0.25, 0.25, 0.4]].forEach(([x, y, s]) => { const c = new THREE.Mesh(new THREE.SphereGeometry(s, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 })); c.position.set(x, y, 0); c.castShadow = true; cloud.add(c); });
cloud.position.set(xs[0], 3.0, 0); scene.add(cloud);
for (let k = 0; k < 12; k++) { const d = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.18, 4, 8), new THREE.MeshStandardMaterial({ color: 0x5fb8f0 })); d.position.set(xs[0] + (Math.random() - 0.5) * 1.2, 1.2 + Math.random() * 1.4, (Math.random() - 0.5) * 0.4); scene.add(d); }
// 2) 튤립 (다 자람)
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.6, 12), green); stem.position.set(xs[1], 1.1, 0); stem.castShadow = true; scene.add(stem);
leaf(xs[1] - 0.25, 0.8, 0.05, 1.3, 0.5); leaf(xs[1] + 0.25, 0.9, 0.05, 1.2, -0.5);
for (let k = 0; k < 5; k++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), new THREE.MeshStandardMaterial({ color: 0xff5f7e, roughness: 0.5 })); const a = k / 5 * Math.PI * 2; p.scale.set(0.6, 1.1, 0.6); p.position.set(xs[1] + Math.cos(a) * 0.14, 2.05, Math.sin(a) * 0.14); p.rotation.set(Math.sin(a) * 0.3, 0, -Math.cos(a) * 0.3); p.castShadow = true; scene.add(p); }
// 3) 당근 (뽑히는 중)
const car = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.3, 20), new THREE.MeshStandardMaterial({ color: 0xff8a2a, roughness: 0.6 })); car.rotation.z = Math.PI; car.position.set(xs[2], 0.95, 0.1); car.castShadow = true; scene.add(car);
[-0.4, 0, 0.4].forEach(a => leaf(xs[2] + Math.sin(a) * 0.3, 1.85, 0.1, 1.1, -a * 1.2));
// 4) 공룡알 (톡 깨지며 아기 공룡)
const egg = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24), new THREE.MeshStandardMaterial({ color: 0xf6f0de, roughness: 0.5 })); egg.scale.set(1, 1.3, 1); egg.position.set(xs[3], 0.75, 0.05); egg.castShadow = true; scene.add(egg);
for (let k = 0; k < 9; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 8), new THREE.MeshStandardMaterial({ color: 0x6fbf6a })); const a = Math.random() * 6.28, b = Math.random() * 1.2 - 0.3; s.position.set(xs[3] + Math.cos(a) * 0.5 * Math.cos(b), 0.75 + Math.sin(b) * 0.6, 0.05 + Math.sin(a) * 0.5 * Math.cos(b)); scene.add(s); }
const baby = await sprite('shared/pics/공룡.webp', 1.3); baby.position.set(xs[3] + 0.1, 1.2, 0.3); scene.add(baby);
// 이름표가 피어남
for (const [i, w, y] of [[1, '튤립', 2.9], [2, '당근', 2.7], [3, '공룡', 2.9]]) { const l = label(w, 0.55, { hi: i === 2 ? 0 : -1 }); l.position.set(xs[i], y, 0.2); scene.add(l); }
// 티노·코코 + 바구니
const tino = await sprite('shared/assets/tino_jump_v2.png', 2.2); tino.position.set(-5.8, 0, 1.2); scene.add(tino);
const coco = await sprite('shared/assets/coco_laugh_v2.png', 2.2); coco.position.set(5.9, 0, 1.2); scene.add(coco);
const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.6, 0.6, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0xc8925a, side: THREE.DoubleSide, roughness: 0.9 })); basket.position.set(0, 0.3, 2.6); basket.castShadow = true; scene.add(basket);
const card = label('딸기', 0.4); card.position.set(0, 0.75, 2.6); card.rotation.x = -0.3; scene.add(card);
r.render(scene, cam); done();
</script></body></html>
